<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172A" />
  <title>HR &amp; Talent Acquisition Console — Joiners &amp; Sourced</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            porcelain: '#FAF8F5',
            navy: '#0F172A',
            solar: '#F97316'
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #FAF8F5;
      color: #0F172A;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =====================================================================
    // 1. CONFIGURATION (Update Web App URL + Firebase Web Keys)
    // =====================================================================
    const APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzp7fyDgAduK1Ddpvg0lgrmdXb7D4eUTYZ4TXlpY5d5hOqRONBhKeW6zDgqWDMATXeH/exec";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyD_g9NrQ5_wGfAw_cCEVi9lzE53E69SovY",
      authDomain: "my-work-flow-e5eb1.firebaseapp.com",
      projectId: "my-work-flow-e5eb1",
      storageBucket: "my-work-flow-e5eb1.firebasestorage.app",
      messagingSenderId: "111611610896",
      appId: "1:888982928867:web:84ca1929558c917c2734d6"
    };

    const JOINER_STATUSES = ["Joined", "OYTJ", "STYO", "Offer Released", "Revoked"];
    const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      db = firebase.firestore();
    } catch (err) {
      console.warn("Firebase init notice:", err);
    }

    // =====================================================================
    // 2. DATE PARSING & WEBHOOK HELPERS
    // =====================================================================
    function getTodayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function parseMonthKey(rawDate) {
      if (!rawDate) return null;
      const s = String(rawDate).trim();
      if (!s) return null;

      // Match YYYY-MM-DD or YYYY/MM/DD
      let iso = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (iso) {
        const yr = parseInt(iso[1], 10);
        const mo = parseInt(iso[2], 10) - 1;
        if (mo >= 0 && mo < 12) {
          return {
            key: `${yr}-${String(mo + 1).padStart(2, "0")}`,
            label: `${MONTH_NAMES[mo]} ${yr}`,
            shortMonth: MONTH_NAMES[mo]
          };
        }
      }

      // Match MM-DD-YYYY or DD-MM-YYYY safely
      const dmy = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/);
      if (dmy) {
        let yr = parseInt(dmy[3], 10);
        if (yr < 100) yr += 2000;
        const p1 = parseInt(dmy[1], 10);
        const p2 = parseInt(dmy[2], 10);
        // If p1 > 12, it's DD-MM-YYYY; otherwise treat as MM-DD-YYYY
        const mo = (p1 > 12 ? p2 : p1) - 1;
        if (mo >= 0 && mo < 12) {
          return {
            key: `${yr}-${String(mo + 1).padStart(2, "0")}`,
            label: `${MONTH_NAMES[mo]} ${yr}`,
            shortMonth: MONTH_NAMES[mo]
          };
        }
      }

      const parsed = new Date(s);
      if (!Number.isNaN(parsed.getTime())) {
        const yr = parsed.getFullYear();
        const mo = parsed.getMonth();
        return {
          key: `${yr}-${String(mo + 1).padStart(2, "0")}`,
          label: `${MONTH_NAMES[mo]} ${yr}`,
          shortMonth: MONTH_NAMES[mo]
        };
      }
      return null;
    }

    async function postToSheetsWebhook(payload) {
      if (!APPS_SCRIPT_WEB_APP_URL || APPS_SCRIPT_WEB_APP_URL.includes("YOUR_DEPLOYMENT_ID")) {
        console.warn("Set APPS_SCRIPT_WEB_APP_URL to push changes to Google Sheets:", payload);
        return;
      }
      await fetch(APPS_SCRIPT_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    function normalizeCandidateDoc(docId, data) {
      const name = (data["Candidate Name"] || data["NAME"] || data.name || "").trim();
      const doj = (data["Date of Joining"] || data["Joining Date"] || "").trim();
      const role = (data["Role"] || data["Designation"] || "").trim();
      const reporting = (data["Reporting"] || data["BU Head"] || "").trim();
      const ctc = (data["Salary / CTC"] || data["Joining CTC"] || data["Expected CTC"] || "").trim();
      const status = (data["Status"] || "Sourced").trim();

      return {
        id: docId,
        raw: data,
        rowNumber: data.rowNumber || null,
        joinerRowNumber: data.joinerRowNumber || null,
        name,
        doj,
        businessUnit: (data["Business Unit"] || "").trim(),
        reporting,
        role,
        ctc,
        phone: (data["Contact Number"] || "").trim(),
        location: (data["Location"] || "").trim(),
        currentCompany: (data["Current Company"] || "").trim(),
        experience: (data["Overall Experience"] || "").trim(),
        noticePeriod: (data["Notice Period"] || "").trim(),
        email: (data["Email"] || "").trim(),
        status,
        createdAt: data.createdAt || 0
      };
    }

    // =====================================================================
    // 3. MAIN APPLICATION
    // =====================================================================
    function App() {
      const [activeTab, setActiveTab] = useState("joiners"); // "joiners" | "sourced" | "positions" | "tasks"
      const [allDocs, setAllDocs] = useState([]);
      const [positions, setPositions] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState("");

      // Joiners filters & modal
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("ALL");
      const [monthFilter, setMonthFilter] = useState("ALL");
      const [showJoinerModal, setShowJoinerModal] = useState(false);
      const [convertingCandidate, setConvertingCandidate] = useState(null);

      const [joinerForm, setJoinerForm] = useState({
        candidateName: "",
        joiningDate: getTodayISO(),
        businessUnit: "",
        reporting: "",
        role: "",
        salaryCtc: "",
        contactNumber: "",
        location: "",
        status: "Joined"
      });

      // Position & Task quick forms
      const [posForm, setPosForm] = useState({
        title: "",
        exp: "1-3 Yrs",
        maxSalary: "",
        department: "",
        businessUnit: "",
        reportingTo: "",
        status: "Open"
      });
      const [taskTitle, setTaskTitle] = useState("");
      const [taskCategory, setTaskCategory] = useState("Reminders");
      const [taskDate, setTaskDate] = useState(getTodayISO());

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3500);
      };

      // Subscribe to Firestore collections
      useEffect(() => {
        if (!db) {
          setLoading(false);
          return;
        }

        const unsubCands = db.collection("candidates").onSnapshot(
          (snap) => {
            const rows = [];
            snap.forEach((doc) => {
              const item = normalizeCandidateDoc(doc.id, doc.data() || {});
              if (item.name) rows.push(item);
            });
            rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAllDocs(rows);
            setLoading(false);
          },
          (err) => {
            console.error("Candidates snapshot error:", err);
            setLoading(false);
          }
        );

        const unsubPos = db.collection("positions").onSnapshot((snap) => {
          const list = [];
          snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
          setPositions(list);
        });

        const unsubTasks = db.collection("tasks").onSnapshot((snap) => {
          const list = [];
          snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
          setTasks(list);
        });

        return () => {
          unsubCands();
          unsubPos();
          unsubTasks();
        };
      }, []);

      // Split Sourced vs Joiners (including Joined, OYTJ, STYO, Offer Released, Revoked)
      const joiners = useMemo(
        () => allDocs.filter((d) => JOINER_STATUSES.includes(d.status)),
        [allDocs]
      );

      const sourcedProfiles = useMemo(
        () => allDocs.filter((d) => !JOINER_STATUSES.includes(d.status)),
        [allDocs]
      );

      const monthOptions = useMemo(() => {
        const map = new Map();
        joiners.forEach((j) => {
          const info = parseMonthKey(j.doj);
          if (info && !map.has(info.key)) {
            map.set(info.key, info.label);
          }
        });
        return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
      }, [joiners]);

      const filteredJoiners = useMemo(() => {
        return joiners.filter((j) => {
          if (statusFilter !== "ALL" && j.status !== statusFilter) return false;
          if (monthFilter !== "ALL") {
            const m = parseMonthKey(j.doj);
            if (!m || m.key !== monthFilter) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const hay = `${j.name} ${j.role} ${j.businessUnit} ${j.reporting} ${j.location} ${j.phone}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [joiners, statusFilter, monthFilter, searchQuery]);

      const filteredSourced = useMemo(() => {
        if (!searchQuery.trim()) return sourcedProfiles;
        const q = searchQuery.toLowerCase();
        return sourcedProfiles.filter((p) => {
          const hay = `${p.name} ${p.role} ${p.currentCompany} ${p.location} ${p.phone} ${p.status}`.toLowerCase();
          return hay.includes(q);
        });
      }, [sourcedProfiles, searchQuery]);

      // Open modal for + Add Joiner or Mark Joined from Sourced
      const openAddJoinerModal = (candidate = null) => {
        setConvertingCandidate(candidate);
        setJoinerForm({
          candidateName: candidate ? candidate.name : "",
          joiningDate: getTodayISO(),
          businessUnit: candidate ? candidate.businessUnit : "",
          reporting: candidate ? (candidate.reporting || candidate.raw["BU Head"] || "") : "",
          role: candidate ? candidate.role : "",
          salaryCtc: candidate ? (candidate.ctc || candidate.raw["Expected CTC"] || "") : "",
          contactNumber: candidate ? candidate.phone : "",
          location: candidate ? candidate.location : "",
          status: "Joined"
        });
        setShowJoinerModal(true);
      };

      const handleSaveJoiner = async (e) => {
        e.preventDefault();
        const name = joinerForm.candidateName.trim();
        if (!name) return;

        const docPayload = {
          "Candidate Name": name,
          "Date of Joining": joinerForm.joiningDate,
          "Joining Date": joinerForm.joiningDate,
          "Business Unit": joinerForm.businessUnit.trim(),
          "Reporting": joinerForm.reporting.trim(),
          "BU Head": joinerForm.reporting.trim(),
          "Role": joinerForm.role.trim(),
          "Designation": joinerForm.role.trim(),
          "Salary / CTC": joinerForm.salaryCtc.trim(),
          "Joining CTC": joinerForm.salaryCtc.trim(),
          "Contact Number": joinerForm.contactNumber.trim(),
          "Location": joinerForm.location.trim(),
          "Status": joinerForm.status || "Joined",
          createdAt: Date.now()
        };

        try {
          if (db) {
            if (convertingCandidate && convertingCandidate.id) {
              await db.collection("candidates").doc(convertingCandidate.id).set(docPayload, { merge: true });
            } else {
              await db.collection("candidates").add(docPayload);
            }
          }

          await postToSheetsWebhook({
            type: "joiner",
            sourceRowNumber: convertingCandidate ? convertingCandidate.rowNumber : null,
            joiner: docPayload
          });

          setShowJoinerModal(false);
          setConvertingCandidate(null);
          notify(`Saved ${name} to Joiners data`);
        } catch (err) {
          console.error("Save joiner error:", err);
          notify("Error saving joiner");
        }
      };

      const handleInlineJoinerStatusChange = async (joiner, newStatus) => {
        try {
          if (db && joiner.id) {
            await db.collection("candidates").doc(joiner.id).set({ Status: newStatus }, { merge: true });
          }
          await postToSheetsWebhook({
            type: "candidate_status",
            rowNumber: joiner.rowNumber || null,
            joinerRowNumber: joiner.joinerRowNumber || null,
            status: newStatus
          });
          notify(`${joiner.name} → ${newStatus}`);
        } catch (err) {
          console.error(err);
        }
      };

      const handleAddPosition = async (e) => {
        e.preventDefault();
        if (!posForm.title.trim()) return;
        const id = "pos_" + Date.now();
        const item = {
          id,
          title: posForm.title.trim(),
          exp: posForm.exp.trim(),
          maxSalary: posForm.maxSalary.trim(),
          department: posForm.department.trim(),
          businessUnit: posForm.businessUnit.trim(),
          reportingTo: posForm.reportingTo.trim(),
          createdDate: getTodayISO(),
          status: posForm.status,
          createdAt: Date.now()
        };
        if (db) await db.collection("positions").doc(id).set(item, { merge: true });
        await postToSheetsWebhook({ type: "position", ...item });
        setPosForm({ title: "", exp: "1-3 Yrs", maxSalary: "", department: "", businessUnit: "", reportingTo: "", status: "Open" });
        notify("Position added");
      };

      const handleAddTask = async (e) => {
        e.preventDefault();
        if (!taskTitle.trim()) return;
        const id = "task_" + Date.now();
        const item = {
          id,
          title: taskTitle.trim(),
          heading: taskCategory,
          date: taskDate,
          completed: false,
          createdAt: Date.now()
        };
        if (db) await db.collection("tasks").doc(id).set(item, { merge: true });
        await postToSheetsWebhook({ type: "task", ...item });
        setTaskTitle("");
        notify("Task added");
      };

      const handleToggleTask = async (task) => {
        const nextCompleted = !task.completed;
        if (db) await db.collection("tasks").doc(task.id).set({ completed: nextCompleted }, { merge: true });
        await postToSheetsWebhook({ type: "task", ...task, completed: nextCompleted });
      };

      const statusCounts = useMemo(() => {
        const counts = { Joined: 0, OYTJ: 0, STYO: 0 };
        joiners.forEach((j) => {
          if (counts[j.status] !== undefined) counts[j.status] += 1;
        });
        return counts;
      }, [joiners]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Header */}
          <header className="bg-navy text-white border-b border-slate-800 sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-solar flex items-center justify-center font-bold text-navy">
                  TA
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-semibold tracking-tight">Workflow Console</h1>
                  <p className="text-xs text-slate-300">Synced with Joiners data &amp; Candidate data</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => openAddJoinerModal(null)}
                  className="bg-solar hover:bg-orange-600 text-white text-sm font-medium px-3.5 py-2 rounded-lg transition cursor-pointer"
                >
                  + Add Joiner
                </button>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto pb-2">
              {[
                { id: "joiners", label: `Joiners (${joiners.length})` },
                { id: "sourced", label: `Sourced (${sourcedProfiles.length})` },
                { id: "positions", label: `Positions (${positions.length})` },
                { id: "tasks", label: `Tasks (${tasks.length})` }
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3.5 py-1.5 rounded-md text-sm font-medium whitespace-nowrap transition cursor-pointer ${
                    activeTab === tab.id
                      ? "bg-white text-navy"
                      : "text-slate-300 hover:bg-slate-800 hover:text-white"
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-navy text-white px-4 py-2.5 rounded-lg shadow-lg text-sm border border-solar">
              {toast}
            </div>
          )}

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            {/* Search & Filter Bar */}
            {(activeTab === "joiners" || activeTab === "sourced") && (
              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex flex-wrap items-center gap-3">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search by name, role, BU, reporting, location, phone..."
                  className="flex-1 min-w-[220px] px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:border-navy"
                />

                {activeTab === "joiners" && (
                  <>
                    <select
                      value={statusFilter}
                      onChange={(e) => setStatusFilter(e.target.value)}
                      className="px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white"
                    >
                      <option value="ALL">All Statuses</option>
                      {JOINER_STATUSES.map((st) => (
                        <option key={st} value={st}>{st}</option>
                      ))}
                    </select>

                    <select
                      value={monthFilter}
                      onChange={(e) => setMonthFilter(e.target.value)}
                      className="px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white"
                    >
                      <option value="ALL">All Joining Months</option>
                      {monthOptions.map(([key, label]) => (
                        <option key={key} value={key}>{label}</option>
                      ))}
                    </select>
                  </>
                )}
              </div>
            )}

            {/* JOINERS TAB */}
            {activeTab === "joiners" && (
              <>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="bg-white rounded-xl p-4 border border-slate-200">
                    <p className="text-xs text-slate-500 uppercase font-medium">Total Joiners</p>
                    <p className="text-2xl font-bold text-navy mt-1">{joiners.length}</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 border border-slate-200">
                    <p className="text-xs text-slate-500 uppercase font-medium">Joined</p>
                    <p className="text-2xl font-bold text-emerald-700 mt-1">{statusCounts.Joined}</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 border border-slate-200">
                    <p className="text-xs text-slate-500 uppercase font-medium">OYTJ</p>
                    <p className="text-2xl font-bold text-solar mt-1">{statusCounts.OYTJ}</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 border border-slate-200">
                    <p className="text-xs text-slate-500 uppercase font-medium">STYO</p>
                    <p className="text-2xl font-bold text-indigo-700 mt-1">{statusCounts.STYO}</p>
                  </div>
                </div>

                {loading ? (
                  <div className="bg-white rounded-xl p-8 text-center text-slate-500 border border-slate-200">
                    Loading Joiners data from Firestore...
                  </div>
                ) : filteredJoiners.length === 0 ? (
                  <div className="bg-white rounded-xl p-8 text-center text-slate-500 border border-slate-200">
                    No joiner records match the current filter. Run <code>syncAllSheetsToFirebase</code> in Apps Script or click <strong>+ Add Joiner</strong>.
                  </div>
                ) : (
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-600">
                        <tr>
                          <th className="py-3 px-4 font-semibold">Candidate Name</th>
                          <th className="py-3 px-4 font-semibold">Date of Joining</th>
                          <th className="py-3 px-4 font-semibold">BU</th>
                          <th className="py-3 px-4 font-semibold">Reporting</th>
                          <th className="py-3 px-4 font-semibold">Role</th>
                          <th className="py-3 px-4 font-semibold">Salary / CTC</th>
                          <th className="py-3 px-4 font-semibold">Contact</th>
                          <th className="py-3 px-4 font-semibold">Location</th>
                          <th className="py-3 px-4 font-semibold">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredJoiners.map((j) => (
                          <tr key={j.id} className="hover:bg-slate-50/80">
                            <td className="py-3 px-4 font-medium text-navy">{j.name}</td>
                            <td className="py-3 px-4 whitespace-nowrap">{j.doj || "—"}</td>
                            <td className="py-3 px-4">{j.businessUnit || "—"}</td>
                            <td className="py-3 px-4">{j.reporting || "—"}</td>
                            <td className="py-3 px-4">{j.role || "—"}</td>
                            <td className="py-3 px-4 whitespace-nowrap">{j.ctc || "—"}</td>
                            <td className="py-3 px-4 whitespace-nowrap">{j.phone || "—"}</td>
                            <td className="py-3 px-4">{j.location || "—"}</td>
                            <td className="py-3 px-4">
                              <select
                                value={j.status}
                                onChange={(e) => handleInlineJoinerStatusChange(j, e.target.value)}
                                className="px-2.5 py-1 rounded-md border border-slate-300 text-xs font-medium bg-white"
                              >
                                {JOINER_STATUSES.map((st) => (
                                  <option key={st} value={st}>{st}</option>
                                ))}
                              </select>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </>
            )}

            {/* SOURCED TAB */}
            {activeTab === "sourced" && (
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                <table className="w-full text-left border-collapse text-sm">
                  <thead className="bg-slate-50 border-b border-slate-200 text-slate-600">
                    <tr>
                      <th className="py-3 px-4 font-semibold">Candidate Name</th>
                      <th className="py-3 px-4 font-semibold">Role</th>
                      <th className="py-3 px-4 font-semibold">Current Company</th>
                      <th className="py-3 px-4 font-semibold">Location</th>
                      <th className="py-3 px-4 font-semibold">Contact</th>
                      <th className="py-3 px-4 font-semibold">Status</th>
                      <th className="py-3 px-4 font-semibold">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredSourced.slice(0, 150).map((p) => (
                      <tr key={p.id} className="hover:bg-slate-50/80">
                        <td className="py-3 px-4 font-medium text-navy">{p.name}</td>
                        <td className="py-3 px-4">{p.role || "—"}</td>
                        <td className="py-3 px-4">{p.currentCompany || "—"}</td>
                        <td className="py-3 px-4">{p.location || "—"}</td>
                        <td className="py-3 px-4 whitespace-nowrap">{p.phone || "—"}</td>
                        <td className="py-3 px-4">
                          <span className="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-700 font-medium">
                            {p.status}
                          </span>
                        </td>
                        <td className="py-3 px-4">
                          <button
                            onClick={() => openAddJoinerModal(p)}
                            className="px-3 py-1 rounded-md bg-navy hover:bg-slate-800 text-white text-xs font-medium cursor-pointer"
                          >
                            Mark Joined
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* POSITIONS TAB */}
            {activeTab === "positions" && (
              <div className="space-y-4">
                <form onSubmit={handleAddPosition} className="bg-white rounded-xl p-4 border border-slate-200 grid grid-cols-1 sm:grid-cols-4 gap-3">
                  <input
                    type="text"
                    required
                    placeholder="Position Title"
                    value={posForm.title}
                    onChange={(e) => setPosForm({ ...posForm, title: e.target.value })}
                    className="px-3 py-2 rounded-lg border border-slate-300 text-sm"
                  />
                  <input
                    type="text"
                    placeholder="Business Unit (e.g., MRL)"
                    value={posForm.businessUnit}
                    onChange={(e) => setPosForm({ ...posForm, businessUnit: e.target.value })}
                    className="px-3 py-2 rounded-lg border border-slate-300 text-sm"
                  />
                  <input
                    type="text"
                    placeholder="Reporting To"
                    value={posForm.reportingTo}
                    onChange={(e) => setPosForm({ ...posForm, reportingTo: e.target.value })}
                    className="px-3 py-2 rounded-lg border border-slate-300 text-sm"
                  />
                  <button
                    type="submit"
                    className="bg-solar hover:bg-orange-600 text-white rounded-lg text-sm font-medium px-4 py-2 cursor-pointer"
                  >
                    + Add Position
                  </button>
                </form>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {positions.map((pos) => (
                    <div key={pos.id} className="bg-white rounded-xl p-4 border border-slate-200">
                      <div className="flex items-center justify-between">
                        <h3 className="font-semibold text-navy">{pos.title}</h3>
                        <span className="text-xs px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-medium">
                          {pos.status || "Open"}
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        BU: {pos.businessUnit || "—"} • Reporting: {pos.reportingTo || "—"}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TASKS TAB */}
            {activeTab === "tasks" && (
              <div className="space-y-4">
                <form onSubmit={handleAddTask} className="bg-white rounded-xl p-4 border border-slate-200 flex flex-wrap gap-3">
                  <input
                    type="text"
                    required
                    placeholder="New task or follow-up..."
                    value={taskTitle}
                    onChange={(e) => setTaskTitle(e.target.value)}
                    className="flex-1 min-w-[200px] px-3 py-2 rounded-lg border border-slate-300 text-sm"
                  />
                  <input
                    type="text"
                    value={taskCategory}
                    onChange={(e) => setTaskCategory(e.target.value)}
                    placeholder="Category"
                    className="px-3 py-2 rounded-lg border border-slate-300 text-sm"
                  />
                  <input
                    type="date"
                    value={taskDate}
                    onChange={(e) => setTaskDate(e.target.value)}
                    className="px-3 py-2 rounded-lg border border-slate-300 text-sm"
                  />
                  <button
                    type="submit"
                    className="bg-solar hover:bg-orange-600 text-white rounded-lg text-sm font-medium px-4 py-2 cursor-pointer"
                  >
                    Add Task
                  </button>
                </form>

                <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
                  {tasks.map((t) => (
                    <div key={t.id} className="p-3.5 flex items-center justify-between gap-3">
                      <label className="flex items-center gap-3 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={!!t.completed}
                          onChange={() => handleToggleTask(t)}
                          className="w-4 h-4 accent-solar"
                        />
                        <span className={t.completed ? "line-through text-slate-400 text-sm" : "text-navy text-sm font-medium"}>
                          {t.title}
                        </span>
                      </label>
                      <span className="text-xs text-slate-500">
                        {t.heading || "Task"} • {t.date || ""}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ADD / MARK JOINED MODAL */}
          {showJoinerModal && (
            <div className="fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200">
                <h2 className="text-lg font-bold text-navy mb-4">
                  {convertingCandidate ? `Mark Joined: ${convertingCandidate.name}` : "Add New Joiner"}
                </h2>

                <form onSubmit={handleSaveJoiner} className="space-y-3 text-sm">
                  <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">Candidate Name *</label>
                    <input
                      type="text"
                      required
                      value={joinerForm.candidateName}
                      onChange={(e) => setJoinerForm({ ...joinerForm, candidateName: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Date of Joining</label>
                      <input
                        type="date"
                        value={joinerForm.joiningDate}
                        onChange={(e) => setJoinerForm({ ...joinerForm, joiningDate: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Status</label>
                      <select
                        value={joinerForm.status}
                        onChange={(e) => setJoinerForm({ ...joinerForm, status: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white"
                      >
                        {JOINER_STATUSES.map((st) => (
                          <option key={st} value={st}>{st}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Business Unit</label>
                      <input
                        type="text"
                        placeholder="e.g., MRL, SMS, MRO"
                        value={joinerForm.businessUnit}
                        onChange={(e) => setJoinerForm({ ...joinerForm, businessUnit: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Reporting</label>
                      <input
                        type="text"
                        placeholder="Reporting manager / BU head"
                        value={joinerForm.reporting}
                        onChange={(e) => setJoinerForm({ ...joinerForm, reporting: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Role</label>
                      <input
                        type="text"
                        value={joinerForm.role}
                        onChange={(e) => setJoinerForm({ ...joinerForm, role: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Salary / CTC</label>
                      <input
                        type="text"
                        placeholder="e.g., 5.5 LPA or 45000"
                        value={joinerForm.salaryCtc}
                        onChange={(e) => setJoinerForm({ ...joinerForm, salaryCtc: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Contact Number</label>
                      <input
                        type="text"
                        value={joinerForm.contactNumber}
                        onChange={(e) => setJoinerForm({ ...joinerForm, contactNumber: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">Location</label>
                      <input
                        type="text"
                        value={joinerForm.location}
                        onChange={(e) => setJoinerForm({ ...joinerForm, location: e.target.value })}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setShowJoinerModal(false)}
                      className="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg bg-solar hover:bg-orange-600 text-white font-medium cursor-pointer"
                    >
                      Save to Joiners data
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
