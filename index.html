<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Work Flow - Real-Time Firebase Workspace</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="./logo.jpeg">
    <link rel="apple-touch-icon" href="./logo.jpeg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F8FAFC">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Manrope', 'sans-serif'] },
                    colors: {
                        porcelain: '#F8FAFC', midnightNavy: '#0F172A', navyMuted: '#64748B',
                        solarOrange: '#F97316', solarHover: '#EA580C', successMint: '#10B981', warningAmber: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --parallax-y: 0px;
        }

        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, h4, .font-heading { font-family: 'Manrope', sans-serif; }

        /* SMOOTH LOADER */
        #smooth-preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(145deg, #F8FAFC 0%, #FFF7ED 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s ease;
        }
        #smooth-preloader.loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-ring {
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            border: 3px solid rgba(249, 115, 22, 0.18);
            border-top-color: #F97316;
            animation: spinSmooth 0.85s cubic-bezier(0.4, 0.15, 0.3, 0.85) infinite;
        }
        @keyframes spinSmooth {
            to { transform: rotate(360deg); }
        }

        /* ENTRANCE REVEAL */
        @keyframes entranceReveal {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.985);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .reveal-enter {
            animation: entranceReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .reveal-stagger > * {
            animation: entranceReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .reveal-stagger > *:nth-child(1) { animation-delay: 0.03s; }
        .reveal-stagger > *:nth-child(2) { animation-delay: 0.08s; }
        .reveal-stagger > *:nth-child(3) { animation-delay: 0.13s; }
        .reveal-stagger > *:nth-child(4) { animation-delay: 0.18s; }

        /* HOVER EFFECTS + MICRO INTERACTION (Flat 2D, no 3D tilt) */
        .app-card {
            position: relative;
            background-color: #FFFFFF;
            border-radius: 18px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04);
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.24s ease;
        }
        .app-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(420px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(249, 115, 22, 0.08), transparent 65%);
            transition: opacity 0.25s ease;
        }
        .app-card:hover {
            transform: translateY(-2px);
            border-color: rgba(249, 115, 22, 0.35);
            box-shadow: 0 10px 20px -6px rgba(15, 23, 42, 0.08), 0 4px 8px -4px rgba(249, 115, 22, 0.06);
        }
        .app-card:hover::after {
            opacity: 1;
        }

        .parallax-layer {
            transform: translate3d(0, var(--parallax-y, 0px), 0);
            transition: transform 0.12s ease-out;
            will-change: transform;
        }

        .app-input {
            background-color: #F8FAFC;
            color: #0F172A;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .app-input:hover {
            border-color: #CBD5E1;
        }
        .app-input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #F97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
            transform: translateY(-1px);
        }

        .app-btn-primary {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
            color: #FFFFFF;
            border-radius: 12px;
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, filter 0.2s ease;
        }
        .app-btn-primary:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 16px -4px rgba(249, 115, 22, 0.38);
            filter: brightness(1.03);
        }
        .app-btn-primary:active {
            transform: scale(0.96) translateY(0);
        }

        .app-btn-secondary {
            background-color: #FFFFFF;
            color: #0F172A;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .app-btn-secondary:hover {
            color: #F97316;
            border-color: rgba(249, 115, 22, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px -2px rgba(15, 23, 42, 0.06);
        }
        .app-btn-secondary:active {
            transform: scale(0.96);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

        const Icons = {

            AddCandidate: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>,

            Tasks: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>,
            Positions: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Calculator: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
        };

        function MotionCard({ children, className = '' }) {
            const cardRef = React.useRef(null);

            const handleMouseMove = (e) => {
                const el = cardRef.current;
                if (!el) return;
                const rect = el.getBoundingClientRect();
                el.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                el.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            };

            return (
                <div
                    ref={cardRef}
                    onMouseMove={handleMouseMove}
                    className={`app-card ${className}`}
                >
                    {children}
                </div>
            );
        }

        const normalizePhone = (val) => (val || '').toString().replace(/\D/g, '').slice(-10);
        const normalizeEmail = (val) => (val || '').toString().trim().toLowerCase();
        const isEmptyVal = (val) => !val || val.toString().trim() === '' || val.toString().trim().toUpperCase() === 'N/A' || val.toString().trim() === '-';

        const JOINER_STATUS_LIST = ['Joined', 'OYTJ', 'STYO', 'Offer Released', 'Revoked'];
        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function parseMonthKey(dateStr, fallbackTimestamp) {
            if (dateStr && !isEmptyVal(dateStr)) {
                const s = dateStr.toString().trim();
                let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
                if (m) {
                    const yr = parseInt(m[1], 10);
                    const mo = parseInt(m[2], 10) - 1;
                    if (mo >= 0 && mo < 12) return { key: `${yr}-${String(mo + 1).padStart(2, '0')}`, label: `${MONTH_NAMES[mo]} ${yr}`, shortMonth: MONTH_NAMES[mo] };
                }
                m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/);
                if (m) {
                    let yr = parseInt(m[3], 10);
                    if (yr < 100) yr += 2000;
                    const p1 = parseInt(m[1], 10);
                    const p2 = parseInt(m[2], 10);
                    const mo = (p1 > 12 ? p2 : p1) - 1;
                    if (mo >= 0 && mo < 12) return { key: `${yr}-${String(mo + 1).padStart(2, '0')}`, label: `${MONTH_NAMES[mo]} ${yr}`, shortMonth: MONTH_NAMES[mo] };
                }
                const parsed = new Date(s);
                if (!isNaN(parsed.getTime())) {
                    const yr = parsed.getFullYear();
                    const mo = parsed.getMonth();
                    return { key: `${yr}-${String(mo + 1).padStart(2, '0')}`, label: `${MONTH_NAMES[mo]} ${yr}`, shortMonth: MONTH_NAMES[mo] };
                }
            }
            const d = new Date(fallbackTimestamp || Date.now());
            const yr = d.getFullYear();
            const mo = d.getMonth();
            return { key: `${yr}-${String(mo + 1).padStart(2, '0')}`, label: `${MONTH_NAMES[mo]} ${yr}`, shortMonth: MONTH_NAMES[mo] };
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [syncStatus, setSyncStatus] = React.useState('Connecting...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);
            const [positions, setPositions] = React.useState([]);
            const [todos, setTodos] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            // JOINERS REPORT & ADD MODAL STATE
            const [selectedMonthKey, setSelectedMonthKey] = React.useState(null);
            const [isAddJoinerOpen, setIsAddJoinerOpen] = React.useState(false);
            const [isSavingJoiner, setIsSavingJoiner] = React.useState(false);
            const [joinerModalMode, setJoinerModalMode] = React.useState('add');
            const [sourceCandidateForJoin, setSourceCandidateForJoin] = React.useState(null);
            const [missingFieldsList, setMissingFieldsList] = React.useState([]);

            const scrollContainerRef = React.useRef(null);

            const getTodayString = () => new Date().toISOString().split('T')[0];
            const getFormattedDDMMYYYY = () => {
                const d = new Date();
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return `${day}-${month}-${d.getFullYear()}`;
            };

            const createEmptyJoinerForm = () => ({
                candidateName: '',
                designation: '',
                role: '',
                department: '',
                businessUnit: '',
                buHead: '',
                location: '',
                contactNumber: '',
                email: '',
                currentCompany: '',
                totalExp: '',
                joiningCtc: '',
                joiningDate: getTodayString(),
                noticePeriod: '',
                source: 'Naukri',
                status: 'Joined'
            });

            const [joinerForm, setJoinerForm] = React.useState(createEmptyJoinerForm);

            React.useEffect(() => {
                const timer = setTimeout(() => {
                    const loader = document.getElementById('smooth-preloader');
                    if (loader) loader.classList.add('loader-hidden');
                }, 320);
                return () => clearTimeout(timer);
            }, []);

            React.useEffect(() => {
                const container = scrollContainerRef.current;
                if (!container) return;

                const onScroll = () => {
                    const offset = Math.min(container.scrollTop * 0.14, 18);
                    document.documentElement.style.setProperty('--parallax-y', `${-offset.toFixed(1)}px`);
                };

                container.addEventListener('scroll', onScroll, { passive: true });
                return () => container.removeEventListener('scroll', onScroll);
            }, []);

            // ADD CANDIDATE FORM STATE
            const initialCandForm = {
                candidateName: '',
                source: 'Naukri',
                role: '',
                department: '',
                businessUnit: '',
                buHead: '',
                location: '',
                contactNumber: '',
                email: '',
                currentCompany: '',
                designation: '',
                totalExp: '',
                currentCtc: '',
                expectedCtc: '',
                noticePeriod: '',
                screenDate: getFormattedDDMMYYYY(),
                status: 'Sourced'
            };
            const [candForm, setCandForm] = React.useState(initialCandForm);
            const [isSavingCand, setIsSavingCand] = React.useState(false);
            const [candSaveBanner, setCandSaveBanner] = React.useState('');

            // Tasks State
            const [newTaskTitle, setNewTaskTitle] = React.useState('');
            const [newTaskHeading, setNewTaskHeading] = React.useState('Interview schedule');
            const [newTaskDate, setNewTaskDate] = React.useState(getTodayString());
            const [isSavingTask, setIsSavingTask] = React.useState(false);

            // Calculators State
            const [dobInput, setDobInput] = React.useState('');
            const [currentSalInput, setCurrentSalInput] = React.useState('');
            const [hikePercentInput, setHikePercentInput] = React.useState('');
            const [oldSalCompare, setOldSalCompare] = React.useState('');
            const [newSalCompare, setNewSalCompare] = React.useState('');

            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [isInstallable, setIsInstallable] = React.useState(false);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setIsInstallable(false);
                setDeferredPrompt(null);
            };

            const formattedCurrentDate = React.useMemo(() => {
                const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                return new Date().toLocaleDateString('en-US', options);
            }, []);

            const [isAddPosOpen, setIsAddPosOpen] = React.useState(false);
            const [editingPosId, setEditingPosId] = React.useState(null);
            const [newPosTitle, setNewPosTitle] = React.useState('');
            const [newPosExp, setNewPosExp] = React.useState('');
            const [newPosSalary, setNewPosSalary] = React.useState('');
            const [newPosDept, setNewPosDept] = React.useState('');
            const [newPosBU, setNewPosBU] = React.useState('');
            const [newPosReporting, setNewPosReporting] = React.useState('');

            // REAL-TIME FIRESTORE LISTENERS
            React.useEffect(() => {
                const unsubCandidates = db.collection("candidates").onSnapshot((snapshot) => {
                    const allCands = snapshot.docs.map(doc => {
                        const item = doc.data();
                        const roleVal = item['Role'] || 'N/A';
                        const desigVal = item['Designation'] || roleVal || 'N/A';
                        const reportingVal = item['Reporting'] || item['BU Head'] || 'N/A';
                        const joinCtcVal = item['Salary / CTC'] || item['Joining CTC'] || item['Expected CTC'] || item['Current CTC'] || 'N/A';
                        const joinDateVal = item['Date of Joining'] || item['Joining Date'] || item['CV Screen Date'] || '';
                        return {
                            docId: doc.id,
                            rowNumber: item.rowNumber || null,
                            joinerRowNumber: item.joinerRowNumber || null,
                            candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N/A',
                            source: item['CV -Source:'] || item['CV -Source-'] || item['source'] || 'Naukri',
                            location: item['Location'] || 'N/A',
                            role: roleVal,
                            designation: desigVal,
                            department: item['Department'] || 'N/A',
                            businessUnit: item['Business Unit'] || item['BU'] || 'N/A',
                            buHead: reportingVal,
                            contactNumber: item['Contact Number'] || 'N/A',
                            currentCompany: item['Current Company'] || 'N/A',
                            totalExp: item['Overall Experience'] || item['Total Experience'] || 'N/A',
                            currentCtc: item['Current CTC'] || 'N/A',
                            expectedCtc: item['Expected CTC'] || 'N/A',
                            joiningCtc: joinCtcVal,
                            joiningDate: joinDateVal,
                            noticePeriod: item['Notice Period'] || 'N/A',
                            emailId: item['Email'] || 'N/A',
                            screenDate: item['CV Screen Date'] || 'N/A',
                            status: item['Status'] || 'Sourced',
                            createdAt: item.createdAt || 0
                        };
                    });

                    allCands.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                    setProfiles(allCands.filter(p => !JOINER_STATUS_LIST.includes(p.status)));
                    setJoiners(allCands.filter(p => JOINER_STATUS_LIST.includes(p.status)));
                    setSyncStatus(`Live (${allCands.length})`);
                }, (error) => {
                    console.error("Firestore candidates error:", error);
                    setSyncStatus("DB Error");
                });

                const unsubTasks = db.collection("tasks").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                    const loadedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            const ageResult = React.useMemo(() => {
                if (!dobInput || dobInput.trim() === '') return null;
                const cleaned = dobInput.trim().replace(/[\/\.]/g, '-');
                const parts = cleaned.split('-');
                if (parts.length !== 3) return { invalid: true };

                let day, month, year;
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    day = parseInt(parts[2], 10);
                } else {
                    day = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    year = parseInt(parts[2], 10);
                    if (year < 100) year += 2000;
                }

                const birthDate = new Date(year, month, day);
                const today = new Date();
                if (isNaN(birthDate.getTime()) || birthDate > today || month < 0 || month > 11 || day < 1 || day > 31) {
                    return { invalid: true };
                }

                let years = today.getFullYear() - birthDate.getFullYear();
                let months = today.getMonth() - birthDate.getMonth();
                let days = today.getDate() - birthDate.getDate();

                if (days < 0) {
                    months--;
                    const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                    days += prevMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
                const totalMonths = years * 12 + months;
                return { invalid: false, years, months, days, totalDays, totalMonths };

                                        </p>
                                    </div>
                                    <button type="button" onClick={() => setIsAddJoinerOpen(false)} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                {missingFieldsList.length > 0 && (
                                    <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 text-xs space-y-1">
                                        <p className="font-extrabold text-amber-800">⚠️ Missing details found from sourced record:</p>
                                        <p className="text-[11px] text-midnightNavy">{missingFieldsList.join(' • ')}</p>
                                    </div>
                                )}

                                <div className="space-y-3 text-xs">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Candidate Name <span className="text-solarOrange">*</span></label>
                                            <input type="text" required value={joinerForm.candidateName} onChange={e => setJoinerForm({ ...joinerForm, candidateName: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-semibold" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-solarOrange mb-1">Final Joining Salary (LPA) <span className="text-solarOrange">*</span></label>
                                            <input type="text" required placeholder="e.g. 9.5 or 9.5 LPA" value={joinerForm.joiningCtc} onChange={e => setJoinerForm({ ...joinerForm, joiningCtc: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-bold border-orange-300 bg-orange-50/30" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Designation <span className="text-solarOrange">*</span></label>
                                            <input type="text" required list="designation-suggestions" placeholder="e.g. Senior Sales Manager" value={joinerForm.designation} onChange={e => setJoinerForm({ ...joinerForm, designation: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Joining Date <span className="text-solarOrange">*</span></label>
                                            <input type="date" required value={joinerForm.joiningDate} onChange={e => setJoinerForm({ ...joinerForm, joiningDate: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Department</label>
                                            <input type="text" list="dept-suggestions" value={joinerForm.department} onChange={e => setJoinerForm({ ...joinerForm, department: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Business Unit</label>
                                            <input type="text" list="bu-suggestions" value={joinerForm.businessUnit} onChange={e => setJoinerForm({ ...joinerForm, businessUnit: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">BU Head</label>
                                            <input type="text" list="bu-head-suggestions" value={joinerForm.buHead} onChange={e => setJoinerForm({ ...joinerForm, buHead: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Location</label>
                                            <input type="text" list="location-suggestions" value={joinerForm.location} onChange={e => setJoinerForm({ ...joinerForm, location: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Contact Number</label>
                                            <input type="text" value={joinerForm.contactNumber} onChange={e => setJoinerForm({ ...joinerForm, contactNumber: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Email ID</label>
                                            <input type="email" value={joinerForm.email} onChange={e => setJoinerForm({ ...joinerForm, email: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Current Company</label>
                                            <input type="text" list="company-suggestions" value={joinerForm.currentCompany} onChange={e => setJoinerForm({ ...joinerForm, currentCompany: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Overall Experience</label>
                                            <input type="text" list="exp-suggestions" value={joinerForm.totalExp} onChange={e => setJoinerForm({ ...joinerForm, totalExp: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Source / Vendor</label>
                                            <input type="text" list="cv-source-suggestions" value={joinerForm.source} onChange={e => setJoinerForm({ ...joinerForm, source: e.target.value })} className="w-full p-2.5 rounded-xl app-input font-medium" />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-200">
                                    <button type="button" onClick={() => setIsAddJoinerOpen(false)} className="px-4 py-2 app-btn-secondary text-xs font-bold text-navyMuted">Cancel</button>
                                    <button type="submit" disabled={isSavingJoiner} className="px-5 py-2 app-btn-primary text-xs font-bold">
                                        {isSavingJoiner ? 'Saving Joiner...' : '✅ Confirm & Save Joiner'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* ADD / EDIT POSITION MODAL */}
                    {isAddPosOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 reveal-enter">
                            <div className="app-card p-5 rounded-2xl max-w-lg w-full space-y-4 bg-white">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <h3 className="font-heading font-extrabold text-base text-midnightNavy">
                                        {editingPosId ? '✏️ Edit Position' : '➕ Add Open Position'}
                                    </h3>
                                    <button onClick={resetPosModal} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Position Name</label>
                                        <input type="text" placeholder="e.g. Sales Manager" value={newPosTitle} onChange={e => setNewPosTitle(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Exp Required</label>
                                            <input type="text" placeholder="e.g. 3-5 Years" value={newPosExp} onChange={e => setNewPosExp(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Max Salary (LPA)</label>
                                            <input type="text" placeholder="e.g. 12 (or 12 LPA)" value={newPosSalary} onChange={e => setNewPosSalary(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Department</label>
                                            <input type="text" placeholder="e.g. Sales" value={newPosDept} onChange={e => setNewPosDept(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Business Unit</label>
                                            <input type="text" placeholder="e.g. AWPs" value={newPosBU} onChange={e => setNewPosBU(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Reporting To</label>
                                        <input type="text" placeholder="e.g. VP Sales" value={newPosReporting} onChange={e => setNewPosReporting(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-200">
                                    <button onClick={resetPosModal} className="px-4 py-2 app-btn-secondary text-xs font-bold text-navyMuted">Cancel</button>
                                    <button onClick={handleSavePosition} className="px-4 py-2 app-btn-primary text-xs font-bold">
                                        {editingPosId ? 'Update Position' : 'Save Position'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CANDIDATE / JOINER DETAIL MODAL */}
                    {selectedCandidate && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 reveal-enter">
                            <div className="app-card p-5 rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto space-y-4 bg-white">
                                <div className="flex justify-between items-start border-b border-slate-200 pb-3">
                                    <div>
                                        <h3 className="font-heading font-extrabold text-xl text-midnightNavy">{selectedCandidate.candidateName}</h3>
                                        <p className="text-xs font-bold text-solarOrange">{selectedCandidate.designation || selectedCandidate.role} • {selectedCandidate.department} ({selectedCandidate.businessUnit})</p>
                                    </div>
                                    <button onClick={() => setSelectedCandidate(null)} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Source</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.source}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Joining / Screen Date</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.joiningDate || selectedCandidate.screenDate}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Contact</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.contactNumber}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Email</p><p className="font-bold text-midnightNavy mt-0.5 truncate">{selectedCandidate.emailId}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current Company</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.currentCompany}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Designation</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.designation}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Location</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.location}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Experience</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.totalExp}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.currentCtc}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Joining / Expected CTC</p><p className="font-bold text-solarOrange mt-0.5">{selectedCandidate.joiningCtc || selectedCandidate.expectedCtc}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Notice Period</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.noticePeriod}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">BU Head</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.buHead}</p></div>
                                </div>

                                <div className="flex justify-end pt-2 border-t border-slate-200">
                                    <button onClick={() => setSelectedCandidate(null)} className="px-4 py-1.5 app-btn-secondary text-xs font-bold text-navyMuted">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
