<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work Flow - Senior HR Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                    },
                    boxShadow: {
                        card3D: '0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.1)',
                        card3DHover: '0 25px 50px -12px rgba(6, 182, 212, 0.25), inset 0 1px 0 0 rgba(255, 255, 255, 0.2)',
                        inset3D: 'inset 0 2px 4px rgba(0, 0, 0, 0.6), inset 0 -1px 2px rgba(255, 255, 255, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e1b4b 0%, #090d16 50%, #05080f 100%);
            background-attachment: fixed;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-3d:hover {
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 25px 50px -12px rgba(6, 182, 212, 0.2), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }
        .input-3d {
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), inset 0 -1px 2px rgba(255, 255, 255, 0.05);
        }
        .input-3d:focus {
            border-color: #06b6d4;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 15px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzg0o4r0RboJGr75shmuf-6fglCaa3xoBTsf6CHUmqe_nNUu5WXAutbCdNJSmgNDlGe/exec";

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [isLoading, setIsLoading] = React.useState(true);
            const [syncStatus, setSyncStatus] = React.useState('Syncing Live Data...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            const [todos, setTodos] = React.useState([
                { id: '1', text: 'Schedule L2 technical round for shortlisted engineers', category: 'Interview schedule', completed: false },
                { id: '2', text: 'Collect previous employment payslips and ID proofs', category: 'Document collection', completed: false },
                { id: '3', text: 'Dispatch laptop and company branded welcome kit', category: 'Welcome kit', completed: false },
                { id: '4', text: 'Send reminder for document submission deadline', category: 'Reminders', completed: false }
            ]);
            const [newTodoText, setNewTodoText] = React.useState('');
            const [newTodoCategory, setNewTodoCategory] = React.useState('Interview schedule');
            const [todoFilter, setTodoFilter] = React.useState('All');

            const [showAlert, setShowAlert] = React.useState(true);

            const parseSheetData = (data) => {
                return data.map((item, index) => ({
                    id: index,
                    candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N/A',
                    source: item['CV -Source-'] || item['CV-Source'] || item['source'] || item['CV SOURCED FROM'] || 'Naukri',
                    location: item['Location'] || item['location'] || 'N/A',
                    role: item['Role'] || item['role'] || 'N/A',
                    department: item['Department'] || item['department'] || 'N/A',
                    businessUnit: item['Business Unit'] || item['businessUnit'] || 'N/A',
                    buHead: item['BU Head'] || item['buHead'] || item['Recruiter'] || 'Unassigned',
                    screenDate: item['CV Screen Date'] || item['screenDate'] || 'N/A',
                    contactNumber: item['Contact Number'] || item['contactNumber'] || 'N/A',
                    currentCompany: item['Current Company'] || item['currentCompany'] || 'N/A',
                    designation: item['Designation'] || item['designation'] || 'N/A',
                    totalExp: item['Overall Experience'] || item['totalExp'] || 'N/A',
                    currentCtc: item['Current CTC'] || item['currentCtc'] || 'N/A',
                    expectedCtc: item['Expected CTC'] || item['expectedCtc'] || 'N/A',
                    noticePeriod: item['Notice Period'] || item['noticePeriod'] || 'N/A',
                    emailId: item['Email'] || item['emailId'] || 'N/A',
                    status: item['Status'] || item['status'] || 'Sourced'
                }));
            };

            const fetchSheetData = React.useCallback(() => {
                setIsLoading(true);
                setSyncStatus('Fetching up-to-date data...');
                fetch(WEBHOOK_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            const formatted = parseSheetData(data);
                            setProfiles(formatted.filter(p => p.status !== 'Joined' && p.status !== 'Offer Released' && p.status !== 'Revoked'));
                            setJoiners(formatted.filter(p => p.status === 'Joined' || p.status === 'Offer Released' || p.status === 'Revoked'));
                            setSyncStatus('Synced (' + formatted.length + ' Records)');
                        }
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error('Fetch error:', err);
                        setSyncStatus('Offline / Cached');
                        setIsLoading(false);
                    });
            }, []);

            React.useEffect(() => {
                fetchSheetData();
            }, [fetchSheetData]);

            const handleStatusChange = (candidate, newStatus) => {
                const confirmed = window.confirm(`Change status of ${candidate.candidateName} to "${newStatus}"?`);
                if (confirmed) {
                    const updated = { ...candidate, status: newStatus };
                    setJoiners(prev => prev.map(item => item.candidateName === candidate.candidateName ? updated : item));

                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });

                    if (selectedCandidate && selectedCandidate.candidateName === candidate.candidateName) {
                        setSelectedCandidate(updated);
                    }
                    alert(`Status updated to "${newStatus}" for ${candidate.candidateName}!`);
                }
            };

            const handleMarkJoined = (candidate) => {
                const confirmed = window.confirm(`Are you sure you want to mark ${candidate.candidateName} as JOINED?`);
                if (confirmed) {
                    const updated = { ...candidate, status: 'Joined' };
                    setProfiles(prev => prev.filter(p => p.candidateName !== candidate.candidateName));
                    setJoiners(prev => [updated, ...prev]);

                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });

                    alert(`${candidate.candidateName} has been moved to the Joiners Directory!`);
                }
            };

            const filteredProfiles = profiles.filter(p => {
                const term = searchTerm.toLowerCase();
                return (
                    p.candidateName.toLowerCase().includes(term) ||
                    p.role.toLowerCase().includes(term) ||
                    p.source.toLowerCase().includes(term) ||
                    p.location.toLowerCase().includes(term) ||
                    p.emailId.toLowerCase().includes(term) ||
                    p.contactNumber.toString().includes(term)
                );
            });

            const getBreakdown = (key) => {
                const allRecords = [...profiles, ...joiners];
                const counts = {};
                allRecords.forEach(item => {
                    const val = item[key] && item[key].toString().trim() !== '' ? item[key] : 'Unspecified';
                    counts[val] = (counts[val] || 0) + 1;
                });
                return Object.entries(counts).sort((a, b) => b[1] - a[1]);
            };

            const totalDatasetCount = profiles.length + joiners.length;

            return (
                <div className="flex h-screen overflow-hidden bg-transparent">
                    {/* 3D Sidebar */}
                    <div className="w-72 card-3d p-6 flex flex-col justify-between hidden md:flex border-r border-white/10 z-10">
                        <div>
                            {/* Logo Only (Clean 3D Presentation) */}

                                                        </td>
                                                        <td className="p-3"><span className="px-2.5 py-1 rounded-lg bg-slate-900/80 border border-white/10 text-xs text-slate-300 shadow-inset3D">{p.source}</span></td>
                                                        <td className="p-3 text-slate-200">{p.role}</td>
                                                        <td className="p-3 text-slate-300">{p.location}</td>
                                                        <td className="p-3 text-slate-300">{p.totalExp}</td>
                                                        <td className="p-3 text-slate-300">{p.noticePeriod}</td>
                                                        <td className="p-3 text-center">
                                                            <button onClick={() => handleMarkJoined(p)} className="px-3.5 py-1.5 rounded-xl bg-cyan-500/20 border border-cyan-500/40 hover:bg-cyan-500/30 text-xs font-bold text-cyan-300 transition shadow-[0_0_10px_rgba(6,182,212,0.15)]">
                                                                Mark Joined
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* JOINERS DIRECTORY TAB */}
                        {activeTab === 'joiners' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-white">Joiners & Offer Management ({joiners.length})</h2>
                                    <button onClick={fetchSheetData} className="px-4 py-2 rounded-xl card-3d text-xs font-bold text-cyan-300 hover:border-cyan-500/40">
                                        {isLoading ? 'Syncing...' : '↻ Refresh Sheet'}
                                    </button>
                                </div>

                                <div className="p-6 rounded-2xl card-3d">
                                    {joiners.length === 0 ? <p className="text-slate-400 text-center py-8">No candidates in joiners status recorded yet.</p> : (
                                        <div className="space-y-4">
                                            {joiners.map((j, idx) => {
                                                const statusStyle = 
                                                    j.status === 'Joined' ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/40 shadow-[0_0_10px_rgba(16,185,129,0.15)]' :
                                                    j.status === 'Offer Released' ? 'bg-cyan-500/10 text-cyan-300 border-cyan-500/40 shadow-[0_0_10px_rgba(6,182,212,0.15)]' : 'bg-rose-500/10 text-rose-300 border-rose-500/40 shadow-[0_0_10px_rgba(244,63,94,0.15)]';

                                                return (
                                                    <div key={idx} className="p-4 rounded-xl bg-slate-900/70 border border-white/10 shadow-inset3D flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                        <div>
                                                            <button onClick={() => setSelectedCandidate(j)} className="font-bold text-white hover:text-cyan-300 text-left text-base">
                                                                👤 {j.candidateName}
                                                            </button>
                                                            <p className="text-xs text-slate-400 mt-1">{j.role} • {j.location} • Exp: {j.totalExp} • CTC: {j.expectedCtc}</p>
                                                        </div>

                                                        <div className="flex items-center gap-3">
                                                            <span className="text-xs font-bold text-slate-400 uppercase">Status:</span>
                                                            <select
                                                                value={j.status || 'Joined'}
                                                                onChange={(e) => handleStatusChange(j, e.target.value)}
                                                                className={`px-3 py-2 rounded-xl input-3D font-bold text-xs outline-none cursor-pointer border ${statusStyle}`}
                                                            >
                                                                <option value="Joined" className="bg-slate-900 text-emerald-300">🟢 Joined</option>
                                                                <option value="Offer Released" className="bg-slate-900 text-cyan-300">🔵 Offer Released</option>
                                                                <option value="Revoked" className="bg-slate-900 text-rose-300">🔴 Revoked</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TO-DO & TASK MANAGER TAB */}
                        {activeTab === 'todos' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-white">Daily To-Do & Workflow Task Manager</h2>
                                
                                <div className="p-6 rounded-2xl card-3d space-y-4">
                                    <h3 className="font-bold text-slate-200 text-sm">Create New Task</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <input 
                                            type="text" 
                                            placeholder="Enter task description..." 
                                            value={newTodoText} 
                                            onChange={e => setNewTodoText(e.target.value)} 
                                            className="md:col-span-2 p-3 rounded-xl input-3D text-white outline-none text-sm placeholder-slate-400" 
                                        />
                                        <select 
                                            value={newTodoCategory} 
                                            onChange={e => setNewTodoCategory(e.target.value)} 
                                            className="p-3 rounded-xl input-3D text-slate-200 outline-none text-sm font-medium cursor-pointer"
                                        >
                                            <option value="Interview schedule" className="bg-slate-900">Interview schedule</option>
                                            <option value="Document collection" className="bg-slate-900">Document collection</option>
                                            <option value="Welcome kit" className="bg-slate-900">Welcome kit</option>
                                            <option value="Reminders" className="bg-slate-900">Reminders</option>
                                            <option value="Custom Task" className="bg-slate-900">Custom List / Custom</option>
                                        </select>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            if(!newTodoText.trim()) return;
                                            setTodos([...todos, { id: Date.now(), text: newTodoText, category: newTodoCategory, completed: false }]);
                                            setNewTodoText('');
                                        }} 
                                        className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500/30 to-purple-500/30 border border-cyan-500/50 hover:from-cyan-500/40 hover:to-purple-500/40 font-bold text-cyan-300 text-sm transition shadow-[0_0_20px_rgba(6,182,212,0.2)]"
                                    >
                                        ➕ Add Task to Workflow
                                    </button>
                                </div>

                                <div className="flex flex-wrap gap-2 pt-2">
                                    {['All', 'Interview schedule', 'Document collection', 'Welcome kit', 'Reminders', 'Custom Task'].map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setTodoFilter(cat)}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition border ${
                                                todoFilter === cat 
                                                    ? 'bg-cyan-500/30 text-cyan-300 border-cyan-500/50 shadow-[0_0_15px_rgba(6,182,212,0.3)]' 
                                                    : 'bg-slate-900/40 text-slate-300 border-white/5 hover:bg-slate-800/60'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="p-6 rounded-2xl card-3d space-y-3">
                                    {todos.filter(t => todoFilter === 'All' || t.category === todoFilter).length === 0 ? (
                                        <p className="text-slate-400 text-center py-6 text-sm">No tasks found in this category.</p>
                                    ) : (
                                        todos.filter(t => todoFilter === 'All' || t.category === todoFilter).map(todo => (
                                            <div key={todo.id} className={`p-4 rounded-xl bg-slate-900/60 border border-white/10 shadow-inset3D flex items-center justify-between transition ${todo.completed ? 'opacity-50' : ''}`}>
                                                <div className="flex items-center space-x-3">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={todo.completed} 
                                                        onChange={() => setTodos(todos.map(t => t.id === todo.id ? {...t, completed: !t.completed} : t))} 
                                                        className="w-5 h-5 accent-cyan-400 cursor-pointer" 
                                                    />
                                                    <div>
                                                        <span className={`text-sm font-semibold ${todo.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>{todo.text}</span>
                                                        <span className="block text-[10px] text-cyan-400 uppercase font-bold mt-0.5">{todo.category}</span>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => setTodos(todos.filter(t => t.id !== todo.id))}
                                                    className="px-3 py-1 rounded-lg bg-rose-500/10 border border-rose-500/30 text-xs font-bold text-rose-400 hover:bg-rose-500/20 transition shadow-[0_0_10px_rgba(244,63,94,0.15)]"
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* CANDIDATE DETAILS MODAL */}
                    {selectedCandidate && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-lg flex items-center justify-center p-4 z-50">
                            <div className="card-3d p-6 md:p-8 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto space-y-6 border border-cyan-500/40 shadow-[0_0_60px_rgba(6,182,212,0.25)]">
                                <div className="flex justify-between items-start border-b border-white/10 pb-4">
                                    <div>
                                        <h3 className="text-2xl font-bold text-white">{selectedCandidate.candidateName}</h3>
                                        <p className="text-sm font-semibold text-cyan-400">{selectedCandidate.role} • {selectedCandidate.department}</p>
                                    </div>
                                    <button onClick={() => setSelectedCandidate(null)} className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 flex items-center justify-center font-bold text-slate-300 text-lg shadow-inset3D">✕</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">CV Source</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.source}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Contact Number</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.contactNumber}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Email Address</p><p className="font-semibold text-slate-200 mt-1 truncate">{selectedCandidate.emailId}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Current Location</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.location}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Current Company</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.currentCompany}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Designation</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.designation}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Overall Experience</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.totalExp}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Notice Period</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.noticePeriod}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Current CTC</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.currentCtc}</p></div>
                                    <div className="p-3.5 rounded-xl bg-slate-900/70 border border-white/5 shadow-inset3D"><p className="text-xs text-slate-400 font-bold uppercase">Expected CTC</p><p className="font-semibold text-slate-200 mt-1">{selectedCandidate.expectedCtc}</p></div>
                                </div>

                                <div className="flex justify-between items-center pt-4 border-t border-white/10">
                                    <button onClick={() => setSelectedCandidate(null)} className="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold text-slate-300 border border-white/10 transition shadow-inset3D">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
