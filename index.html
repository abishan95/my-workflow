<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Work Flow - Premium Personal Workspace</title>
    <!-- Favicon & PWA / Mobile Capability Tags -->
    <link rel="icon" type="image/jpeg" href="./logo.jpeg">
    <link rel="apple-touch-icon" href="./logo.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F5F5F7">
    <!-- Google Fonts: Manrope (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Manrope', 'sans-serif'],
                    },
                    colors: {
                        porcelain: '#F5F5F7',
                        porcelainCard: '#FFFFFF',
                        midnightNavy: '#0F172A',
                        navySurface: '#1E293B',
                        navyMuted: '#64748B',
                        solarOrange: '#F97316',
                        solarHover: '#EA580C',
                        successMint: '#10B981',
                        warningAmber: '#F59E0B',
                    },
                    boxShadow: {
                        neoRaised: '6px 6px 14px #E2E2E8, -6px -6px 14px #FFFFFF',
                        neoRaisedHover: '8px 8px 18px #D6D6E0, -8px -8px 18px #FFFFFF',
                        neoInset: 'inset 3px 3px 8px #E2E8F0, inset -3px -3px 8px #FFFFFF',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F5F5F7;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Manrope', sans-serif;
        }
        .neo-card {
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 6px 6px 14px #E2E2E8, -6px -6px 14px #FFFFFF;
            border: 1px solid #E2E8F0;
            transition: all 0.2s ease-in-out;
        }
        .neo-card:hover {
            box-shadow: 8px 8px 18px #D6D6E0, -8px -8px 18px #FFFFFF;
            border-color: #CBD5E1;
            transform: translateY(-2px);
        }
        .neo-card-flat {
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 6px 6px 14px #E2E2E8, -6px -6px 14px #FFFFFF;
            border: 1px solid #E2E8F0;
        }
        .neo-input {
            background-color: #F8FAFC;
            color: #0F172A;
            border-radius: 14px;
            box-shadow: inset 3px 3px 7px #E2E8F0, inset -3px -3px 7px #FFFFFF;
            border: 1px solid #E2E8F0;
            transition: all 0.2s ease;
        }
        .neo-input:focus {
            outline: none;
            border-color: #F97316;
            box-shadow: inset 3px 3px 7px #E2E8F0, 0 0 0 3px rgba(249, 115, 22, 0.2);
        }
        .neo-btn-primary {
            background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
            color: #FFFFFF;
            border-radius: 14px;
            box-shadow: 4px 4px 10px #E2E2E8, -4px -4px 10px #FFFFFF;
            transition: all 0.18s ease;
        }
        .neo-btn-primary:hover {
            background: linear-gradient(135deg, #FB923C 0%, #F97316 100%);
            box-shadow: 6px 6px 14px #D6D6E0, -6px -6px 14px #FFFFFF;
            transform: translateY(-1px);
        }
        .neo-btn-primary:active {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2);
            transform: translateY(1px);
        }
        .neo-btn-secondary {
            background-color: #FFFFFF;
            color: #0F172A;
            border-radius: 14px;
            box-shadow: 4px 4px 10px #E2E2E8, -4px -4px 10px #FFFFFF;
            border: 1px solid #E2E8F0;
            transition: all 0.18s ease;
        }
        .neo-btn-secondary:hover {
            box-shadow: 6px 6px 14px #D6D6E0, -6px -6px 14px #FFFFFF;
            color: #F97316;
            border-color: #CBD5E1;
        }
        .neo-btn-secondary:active {
            box-shadow: inset 3px 3px 6px #E2E8F0, inset -3px -3px 6px #FFFFFF;
        }
        .neo-btn-active {
            background: #FFF7ED;
            color: #F97316;
            border: 1px solid #FFEDD5;
            border-radius: 14px;
            box-shadow: inset 3px 3px 7px #FED7AA, inset -3px -3px 7px #FFFFFF;
            font-weight: 700;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F5F5F7;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F97316;
        }
    </style>
</head>
<body class="bg-porcelain text-midnightNavy min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzg0o4r0RboJGr75shmuf-6fglCaa3xoBTsf6CHUmqe_nNUu5WXAutbCdNJSmgNDlGe/exec";

        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Directory: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            Joiners: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Tasks: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>,
            Positions: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Sync: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(true);
            const [syncStatus, setSyncStatus] = React.useState('Syncing Live Data...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);
            const [positions, setPositions] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            const [taskViewMode, setTaskViewMode] = React.useState('Weekly');
            const [taskFilterStatus, setTaskFilterStatus] = React.useState('All');

            const getTodayString = () => new Date().toISOString().split('T')[0];
            const [newTaskTitle, setNewTaskTitle] = React.useState('');
            const [newTaskHeading, setNewTaskHeading] = React.useState('Interview schedule');
            const [newTaskDate, setNewTaskDate] = React.useState(getTodayString());
            const [todos, setTodos] = React.useState([]);

            const formattedCurrentDate = React.useMemo(() => {
                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                return new Date().toLocaleDateString('en-US', options);
            }, []);

            // State for Add / Edit Position Modal
            const [isAddPosOpen, setIsAddPosOpen] = React.useState(false);
            const [editingPosId, setEditingPosId] = React.useState(null);
            const [newPosTitle, setNewPosTitle] = React.useState('');
            const [newPosExp, setNewPosExp] = React.useState('');
            const [newPosSalary, setNewPosSalary] = React.useState('');
            const [newPosDept, setNewPosDept] = React.useState('');
            const [newPosBU, setNewPosBU] = React.useState('');
            const [newPosReporting, setNewPosReporting] = React.useState('');

            const parseSheetData = (data) => {
                return data.map((item, index) => ({
                    id: index,
                    candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N me',
                    source: item['CV -Source-'] || item['CV-Source'] || item['source'] || item['CV SOURCED FROM'] || 'Naukri',
                    location: item['Location'] || item['location'] || 'N/A',
                    role: item['Role'] || item['role'] || 'N/A',
                    department: item['Department'] || item['department'] || 'N/A',
                    businessUnit: item['Business Unit'] || item['businessUnit'] || 'N/A',
                    buHead: item['BU Head'] || item['buHead'] || item['Recruiter'] || 'Unassigned',
                    screenDate: item['CV Screen Date'] || item['screenDate'] || 'N/A',
                    contactNumber: item['Contact Number'] || item['contactNumber'] || 'N/A',
                    currentCompany: item['Current Company'] || item['currentCompany'] || 'N/A',
                    designation: item['Designation'] || item['designation'] || 'N/A',
                    totalExp: item['Overall Experience'] || item['totalExp'] || 'N/A',
                    currentCtc: item['Current CTC'] || item['currentCtc'] || 'N/A',
                    expectedCtc: item['Expected CTC'] || item['expectedCtc'] || 'N/A',
                    noticePeriod: item['Notice Period'] || item['noticePeriod'] || 'N/A',
                    emailId: item['Email'] || item['emailId'] || 'N/A',
                    status: item['Status'] || item['status'] || 'Sourced'
                }));
            };

            const fetchSheetData = React.useCallback(() => {
                setIsLoading(true);
                setSyncStatus('Fetching live data...');
                fetch(WEBHOOK_URL)
                    .then(res => res.json())
                    .then(data => {
                        const rawCandidates = Array.isArray(data) ? data : (data.candidates || []);
                        const rawTasks = !Array.isArray(data) && data.tasks ? data.tasks : [];
                        const rawPositions = !Array.isArray(data) && data.positions ? data.positions : [];

                        const formatted = parseSheetData(rawCandidates);
                        setProfiles(formatted.filter(p => p.status !== 'Joined' && p.status !== 'Offer Released' && p.status !== 'Revoked'));
                        setJoiners(formatted.filter(p => p.status === 'Joined' || p.status === 'Offer Released' || p.status === 'Revoked'));
                        
                        if (rawTasks.length > 0) {
                            setTodos(rawTasks.map(t => ({
                                id: t.id ? t.id.toString() : Date.now().toString(),
                                title: t.title || '',
                                heading: t.heading || 'Custom task',
                                date: t.date || getTodayString(),
                                completed: t.completed === true || t.completed === 'TRUE' || t.completed === 'true'
                            })));
                        }

                        if (rawPositions.length > 0) {
                            setPositions(rawPositions.map(p => ({
                                id: p.id ? p.id.toString() : Date.now().toString(),
                                title: p.title || 'N/A',
                                exp: p.exp || 'N/A',
                                maxSalary: p.maxSalary || 'N/A',
                                department: p.department || 'N/A',
                                businessUnit: p.businessUnit || 'N/A',
                                reportingTo: p.reportingTo || 'N/A',
                                createdDate: p.createdDate || getTodayString(),
                                status: p.status || 'Open'
                            })));
                        }

                        setSyncStatus('Synced (' + formatted.length + ' Records)');
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error('Fetch error:', err);
                        setSyncStatus('Offline / Cached');
                        setIsLoading(false);
                    });
            }, []);

            React.useEffect(() => {
                fetchSheetData();
            }, [fetchSheetData]);

            // Format salary to automatically ensure Lakhs per Annum (LPA) suffix
            const formatSalaryLPA = (val) => {
                if (!val) return 'Negotiable';
                const trimmed = val.toString().trim();
                if (/lpa|lacs|lakhs|per annum/i.test(trimmed)) {
                    return trimmed;
                }
                return `${trimmed} LPA`;
            };

            // Save or Update Position
            const handleSavePosition = () => {
                if (!newPosTitle.trim()) return;

                const formattedSalary = formatSalaryLPA(newPosSalary);

                if (editingPosId) {
                    // Updating an existing position
                    let updatedPos = null;
                    setPositions(prev => prev.map(p => {
                        if (p.id === editingPosId) {
                            updatedPos = {
                                ...p,
                                type: 'position',
                                title: newPosTitle,
                                exp: newPosExp || '0-2 Yrs',
                                maxSalary: formattedSalary,
                                department: newPosDept || 'General',
                                businessUnit: newPosBU || 'Main Unit',
                                reportingTo: newPosReporting || 'HOD'
                            };
                            return updatedPos;
                        }
                        return p;
                    }));

                    if (updatedPos) {
                        fetch(WEBHOOK_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updatedPos)
                        }).catch(err => console.error("Error updating position:", err));
                    }
                } else {
                    // Creating a new position
                    const newPos = {
                        type: 'position',
                        id: Date.now().toString(),
                        title: newPosTitle,
                        exp: newPosExp || '0-2 Yrs',
                        maxSalary: formattedSalary,
                        department: newPosDept || 'General',
                        businessUnit: newPosBU || 'Main Unit',
                        reportingTo: newPosReporting || 'HOD',
                        createdDate: getTodayString(),
                        status: 'Open'
                    };

                    setPositions(prev => [newPos, ...prev]);

                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newPos)
                    }).catch(err => console.error("Error adding position:", err));
                }

                resetPosModal();
            };

            // Open Edit Modal prepopulated with existing position data
            const openEditPosition = (pos) => {
                setEditingPosId(pos.id);
                setNewPosTitle(pos.title);
                setNewPosExp(pos.exp);
                setNewPosSalary(pos.maxSalary);
                setNewPosDept(pos.department);
                setNewPosBU(pos.businessUnit);
                setNewPosReporting(pos.reportingTo);
                setIsAddPosOpen(true);
            };

            const resetPosModal = () => {
                setIsAddPosOpen(false);
                setEditingPosId(null);
                setNewPosTitle(''); 
                setNewPosExp(''); 
                setNewPosSalary(''); 
                setNewPosDept(''); 
                setNewPosBU(''); 
                setNewPosReporting('');
            };

            const handlePositionStatusChange = (posId, newStatus) => {
                let updatedPos = null;
                setPositions(prev => prev.map(p => {
                    if (p.id === posId) {
                        updatedPos = { ...p, type: 'position', status: newStatus };
                        return updatedPos;
                    }
                    return p;
                }));

                if (updatedPos) {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedPos)
                    }).catch(err => console.error("Error updating position status:", err));
                }
            };

            const calculateAgeing = (createdDateStr) => {
                if (!createdDateStr || createdDateStr === 'N/A') return 0;
                const created = new Date(createdDateStr);
                const today = new Date();
                const diffTime = Math.abs(today - created);
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            };

            const getProfilesSharedCount = (posTitle, posCreatedDate) => {
                const allCandidates = [...profiles, ...joiners];
                return allCandidates.filter(c => {
                    const matchesRole = c.role.toLowerCase().includes(posTitle.toLowerCase()) || posTitle.toLowerCase().includes(c.role.toLowerCase());
                    if (!matchesRole) return false;
                    
                    if (c.screenDate && c.screenDate !== 'N/A') {
                        return c.screenDate >= posCreatedDate;
                    }
                    return true;
                }).length;
            };

            const handleStatusChange = (candidate, newStatus) => {
                const confirmed = window.confirm(`Change status of ${candidate.candidateName} to "${newStatus}"?`);
                if (confirmed) {
                    const updated = { ...candidate, status: newStatus };
                    setJoiners(prev => prev.map(item => item.candidateName === candidate.candidateName ? updated : item));

                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });

                    if (selectedCandidate && selectedCandidate.candidateName === candidate.candidateName) {
                        setSelectedCandidate(updated);
                    }
                }
            };

            const handleMarkJoined = (candidate) => {
                const confirmed = window.confirm(`Mark ${candidate.candidateName} as JOINED?`);
                if (confirmed) {
                    const updated = { ...candidate, status: 'Joined' };
                    setProfiles(prev => prev.filter(p => p.candidateName !== candidate.candidateName));
                    setJoiners(prev => [updated, ...prev]);

                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                }
            };

            const handleAddTask = () => {
                if (!newTaskTitle.trim()) return;
                const newTask = {
                    type: 'task',
                    id: Date.now().toString(),
                    title: newTaskTitle,
                    heading: newTaskHeading,
                    date: newTaskDate || getTodayString(),
                    completed: false
                };

                setTodos(prev => [...prev, newTask]);
                setNewTaskTitle('');
                setNewTaskDate(getTodayString());

                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTask)
                }).catch(err => console.error("Error saving task:", err));
            };

            const toggleTaskStatus = (id) => {
                let updatedTask = null;
                setTodos(prev => prev.map(t => {
                    if (t.id === id) {
                        updatedTask = { ...t, type: 'task', completed: !t.completed };
                        return updatedTask;
                    }
                    return t;
                }));

                if (updatedTask) {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedTask)
                    }).catch(err => console.error("Error updating task status:", err));
                }
            };

            const deleteTask = (id) => {
                setTodos(prev => prev.filter(t => t.id !== id));

                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'task', action: 'delete_task', id: id })
                }).catch(err => console.error("Error deleting task:", err));
            };

            const filteredProfiles = profiles.filter(p => {
                const term = searchTerm.toLowerCase();
                return (
                    p.candidateName.toLowerCase().includes(term) ||
                    p.role.toLowerCase().includes(term) ||
                    p.source.toLowerCase().includes(term) ||
                    p.location.toLowerCase().includes(term) ||
                    p.emailId.toLowerCase().includes(term) ||
                    p.contactNumber.toString().includes(term)
                );
            });

            const getBreakdown = (key) => {
                const allRecords = [...profiles, ...joiners];
                const counts = {};
                allRecords.forEach(item => {
                    const val = item[key] && item[key].toString().trim() !== '' ? item[key] : 'Unspecified';
                    counts[val] = (counts[val] || 0) + 1;
                });
                return Object.entries(counts).sort((a, b) => b[1] - a[1]);
            };

            const totalDatasetCount = profiles.length + joiners.length;
            const completedCount = todos.filter(t => t.completed).length;
            const pendingCount = todos.filter(t => !t.completed).length;

            const getWeekDates = () => {
                const curr = new Date();
                const day = curr.getDay();
                const diff = curr.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(curr.setDate(diff));
                
                const week = [];
                for (let i = 0; i < 7; i++) {
                    const nextDay = new Date(monday);
                    nextDay.setDate(monday.getDate() + i);
                    week.push({
                        name: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][i],
                        dateStr: nextDay.toISOString().split('T')[0]
                    });
                }
                return week;
            };

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-porcelain text-midnightNavy">
                    
                    {/* Mobile Header Toggle */}
                    <div className="md:hidden flex items-center justify-between p-4 neo-card m-3 mb-0 z-30">
                        <div className="flex items-center space-x-3">
                            <img src="./logo.jpeg" alt="Logo" className="w-8 h-8 rounded-xl object-cover border border-slate-200" />
                            <span className="font-heading font-extrabold text-sm text-midnightNavy">My Work Flow</span>
                        </div>
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 neo-input rounded-xl text-solarOrange">
                            <Icons.Menu />

                                                            <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition">
                                                                <td className="p-3.5">
                                                                    <button onClick={() => setSelectedCandidate(p)} className="font-bold text-solarOrange hover:underline text-left">
                                                                        {p.candidateName}
                                                                    </button>
                                                                </td>
                                                                <td className="p-3.5"><span className="px-2.5 py-1 rounded-md neo-input text-[11px] font-medium text-navyMuted">{p.source}</span></td>
                                                                <td className="p-3.5 font-medium text-midnightNavy">{p.role}</td>
                                                                <td className="p-3.5 text-navyMuted">{p.location}</td>
                                                                <td className="p-3.5 text-navyMuted">{p.totalExp}</td>
                                                                <td className="p-3.5 text-navyMuted">{p.noticePeriod}</td>
                                                                <td className="p-3.5 text-center">
                                                                    <button onClick={() => handleMarkJoined(p)} className="px-3.5 py-1.5 neo-btn-primary text-[11px] font-bold">
                                                                        Mark Joined
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* JOINERS DIRECTORY PAGE */}
                            {activeTab === 'joiners' && (
                                <div className="space-y-6">
                                    <div className="p-6 rounded-[20px] neo-card">
                                        <div className="flex justify-between items-center border-b border-slate-200 pb-4 mb-4">
                                            <div>
                                                <h2 className="font-heading font-bold text-base text-midnightNavy">Joiners & Offer Directory ({joiners.length})</h2>
                                                <p className="text-xs text-navyMuted mt-0.5">Candidates with released offers or confirmed joining</p>
                                            </div>
                                            <button onClick={fetchSheetData} className="px-4 py-2 neo-btn-secondary text-xs font-bold flex items-center gap-2">
                                                <Icons.Sync /> Refresh Sheet
                                            </button>
                                        </div>

                                        {joiners.length === 0 ? (
                                            <p className="text-navyMuted text-center py-8 text-xs font-medium">No candidates in offer/joined status yet.</p>
                                        ) : (
                                            <div className="space-y-3">
                                                {joiners.map((j, idx) => (
                                                    <div key={idx} className="p-4 rounded-xl neo-input flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                        <div>
                                                            <button onClick={() => setSelectedCandidate(j)} className="font-heading font-bold text-midnightNavy hover:text-solarOrange text-sm text-left">
                                                                {j.candidateName}
                                                            </button>
                                                            <p className="text-xs text-navyMuted mt-0.5">{j.role} • {j.location} • Exp: {j.totalExp} • Expected CTC: {j.expectedCtc}</p>
                                                        </div>

                                                        <div className="flex items-center gap-3">
                                                            <span className="text-xs font-bold text-navyMuted">Status:</span>
                                                            <select
                                                                value={j.status || 'Joined'}
                                                                onChange={(e) => handleStatusChange(j, e.target.value)}
                                                                className="px-3 py-1.5 rounded-xl neo-input text-xs font-bold text-midnightNavy outline-none cursor-pointer"
                                                            >
                                                                <option value="Joined" className="bg-white">🟢 Joined</option>
                                                                <option value="Offer Released" className="bg-white">🔵 Offer Released</option>
                                                                <option value="Revoked" className="bg-white">🔴 Revoked</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* TASK MANAGEMENT PAGE */}
                            {activeTab === 'todos' && (
                                <div className="space-y-6">
                                    <div className="p-6 rounded-[20px] neo-card space-y-4">
                                        <div className="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-200 pb-4">
                                            <div>
                                                <h2 className="font-heading font-bold text-base text-midnightNavy">Task Creation Console</h2>
                                                <p className="text-xs text-navyMuted mt-0.5">Add new tasks, reminders, or custom workflow items</p>
                                            </div>

                                            <div className="flex items-center space-x-2 p-1 rounded-2xl neo-input">
                                                {['Daily', 'Weekly', 'Monthly'].map(v => (
                                                    <button
                                                        key={v}
                                                        onClick={() => setTaskViewMode(v)}
                                                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                                                            taskViewMode === v 
                                                                ? 'neo-btn-primary' 
                                                                : 'text-navyMuted hover:text-midnightNavy'
                                                        }`}
                                                    >
                                                        {v}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                                            <div>
                                                <label className="block text-[11px] font-bold uppercase text-navyMuted mb-1">1. Enter Task</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="Task description..." 
                                                    value={newTaskTitle} 
                                                    onChange={e => setNewTaskTitle(e.target.value)} 
                                                    className="w-full p-2.5 rounded-xl neo-input text-midnightNavy text-xs font-medium placeholder-navyMuted" 
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[11px] font-bold uppercase text-navyMuted mb-1">2. Heading</label>
                                                <select 
                                                    value={newTaskHeading} 
                                                    onChange={e => setNewTaskHeading(e.target.value)} 
                                                    className="w-full p-2.5 rounded-xl neo-input text-midnightNavy text-xs font-bold cursor-pointer"
                                                >
                                                    <option value="Interview schedule" className="bg-white">Interview schedule</option>
                                                    <option value="Welcome Kit" className="bg-white">Welcome Kit</option>
                                                    <option value="Reminders" className="bg-white">Reminders</option>
                                                    <option value="Custom task" className="bg-white">Custom task</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-[11px] font-bold uppercase text-navyMuted mb-1">3. Calendar Date</label>
                                                <input 
                                                    type="date" 
                                                    value={newTaskDate} 
                                                    onChange={e => setNewTaskDate(e.target.value)} 
                                                    className="w-full p-2.5 rounded-xl neo-input text-midnightNavy text-xs font-medium cursor-pointer" 
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[11px] font-bold uppercase text-navyMuted mb-1 opacity-0">Action</label>
                                                <button 
                                                    onClick={handleAddTask} 
                                                    className="w-full py-2.5 neo-btn-primary font-bold text-xs"
                                                >
                                                    💾 Save Task
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col md:flex-row items-center justify-between gap-4 p-4 rounded-[20px] neo-card">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-xs font-bold text-navyMuted uppercase mr-2">Filter Status:</span>
                                            {['All', 'Pending', 'Completed'].map(f => (
                                                <button
                                                    key={f}
                                                    onClick={() => setTaskFilterStatus(f)}
                                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                                                        taskFilterStatus === f 
                                                            ? 'neo-btn-active' 
                                                            : 'text-navyMuted hover:text-midnightNavy'
                                                    }`}
                                                >
                                                    {f}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="flex items-center space-x-3 text-xs font-bold">
                                            <span className="px-3 py-1 rounded-xl bg-amber-50 text-warningAmber border border-amber-200 shadow-neoInset">
                                                ⏳ Pending: {pendingCount}
                                            </span>
                                            <span className="px-3 py-1 rounded-xl bg-emerald-50 text-successMint border border-emerald-200 shadow-neoInset">
                                                ✅ Completed: {completedCount}
                                            </span>
                                            <span className="px-3 py-1 rounded-xl bg-orange-100 text-solarOrange border border-orange-200 shadow-neoInset">
                                                Diff: {completedCount - pendingCount}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="p-6 rounded-[20px] neo-card space-y-6">
                                        <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                            <h3 className="font-heading font-bold text-sm text-midnightNavy">Schedule View ({taskViewMode})</h3>
                                            <span className="text-xs text-solarOrange font-medium">Automatic Pending Roll-over Enabled</span>
                                        </div>

                                        {taskViewMode === 'Daily' && (
                                            <div className="space-y-3">
                                                {todos.filter(t => t.date === getTodayString() && (taskFilterStatus === 'All' || (taskFilterStatus === 'Completed' ? t.completed : !t.completed))).length === 0 ? (
                                                    <p className="text-navyMuted text-xs italic py-8 text-center">No tasks scheduled for today.</p>
                                                ) : (
                                                    todos.filter(t => t.date === getTodayString() && (taskFilterStatus === 'All' || (taskFilterStatus === 'Completed' ? t.completed : !t.completed))).map(t => (
                                                        <div key={t.id} className="p-4 rounded-xl neo-input flex items-center justify-between">
                                                            <div>
                                                                <span className="px-2 py-0.5 rounded-md bg-orange-100 text-solarOrange text-[10px] font-bold border border-orange-200">{t.heading}</span>
                                                                <h4 className={`font-bold text-xs mt-1 ${t.completed ? 'line-through text-navyMuted' : 'text-midnightNavy'}`}>{t.title}</h4>
                                                                <p className="text-[10px] text-navyMuted mt-0.5">Date: {t.date}</p>
                                                            </div>
                                                            <div className="flex items-center space-x-2">
                                                                <button 
                                                                    onClick={() => toggleTaskStatus(t.id)} 
                                                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold ${t.completed ? 'bg-amber-50 text-warningAmber border border-amber-200' : 'bg-emerald-50 text-successMint border border-emerald-200'}`}
                                                                >
                                                                    {t.completed ? 'Mark Pending' : 'Mark Completed'}
                                                                </button>
                                                                <button onClick={() => deleteTask(t.id)} className="text-solarOrange text-xs font-bold hover:underline px-2">Delete</button>
                                                            </div>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        )}

                                        {taskViewMode === 'Weekly' && (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-7 gap-3">
                                                {getWeekDates().map((dayObj, idx) => {
                                                    const dayTasks = todos.filter(t => t.date === dayObj.dateStr && (taskFilterStatus === 'All' || (taskFilterStatus === 'Completed' ? t.completed : !t.completed)));
                                                    return (
                                                        <div key={idx} className="p-3 rounded-xl neo-input space-y-3 min-h-[180px]">
                                                            <div className="border-b border-slate-200 pb-1 flex flex-col">
                                                                <h4 className="font-bold text-xs text-midnightNavy">{dayObj.name}</h4>
                                                                <span className="text-[9px] text-solarOrange font-bold">{dayObj.dateStr}</span>
                                                            </div>
                                                            <div className="space-y-2">
                                                                {dayTasks.length === 0 ? (
                                                                    <p className="text-[10px] text-navyMuted italic text-center py-4">No tasks</p>
                                                                ) : (
                                                                    dayTasks.map(t => (
                                                                        <div key={t.id} className={`p-2 rounded-lg text-xs ${t.completed ? 'bg-emerald-50 text-successMint border border-emerald-200' : 'bg-white shadow-neoRaised text-midnightNavy border border-slate-200'}`}>
                                                                            <span className="block text-[9px] font-bold text-solarOrange uppercase">{t.heading}</span>
                                                                            <p className={`font-medium mt-0.5 ${t.completed ? 'line-through opacity-70' : ''}`}>{t.title}</p>
                                                                            <div className="flex justify-between items-center mt-2 pt-1 border-t border-slate-100 text-[10px]">
                                                                                <button onClick={() => toggleTaskStatus(t.id)} className="font-bold text-solarOrange hover:underline">
                                                                                    {t.completed ? 'Pending' : 'Done'}
                                                                                </button>
                                                                                <span className="text-navyMuted">{t.date}</span>
                                                                            </div>
                                                                        </div>
                                                                    ))
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {taskViewMode === 'Monthly' && (
                                            <div>
                                                {todos.filter(t => (taskFilterStatus === 'All' || (taskFilterStatus === 'Completed' ? t.completed : !t.completed))).length === 0 ? (
                                                    <p className="text-navyMuted text-xs italic py-8 text-center">No tasks added yet for this month.</p>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                                        {todos.filter(t => (taskFilterStatus === 'All' || (taskFilterStatus === 'Completed' ? t.completed : !t.completed))).map(t => (
                                                            <div key={t.id} className="p-4 rounded-xl neo-input space-y-2">
                                                                <div className="flex justify-between items-center">
                                                                    <span className="px-2 py-0.5 rounded bg-orange-100 text-solarOrange text-[10px] font-bold border border-orange-200">{t.heading}</span>
                                                                    <span className="text-xs font-bold text-solarOrange">📅 {t.date}</span>
                                                                </div>
                                                                <h4 className={`font-bold text-xs ${t.completed ? 'line-through text-navyMuted' : 'text-midnightNavy'}`}>{t.title}</h4>
                                                                <div className="flex justify-between items-center pt-2 border-t border-slate-200">
                                                                    <button onClick={() => toggleTaskStatus(t.id)} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${t.completed ? 'bg-amber-50 text-warningAmber border border-amber-200' : 'bg-emerald-50 text-successMint border border-emerald-200'}`}>
                                                                        {t.completed ? 'Mark Pending' : 'Mark Completed'}
                                                                    </button>
                                                                    <button onClick={() => deleteTask(t.id)} className="text-solarOrange text-[10px] font-bold">Delete</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>

                                </div>
                            )}

                        </div>
                    </main>

                    {/* ADD / EDIT POSITION MODAL */}
                    {isAddPosOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="neo-card p-6 rounded-[22px] max-w-lg w-full space-y-4 border border-slate-200 bg-white">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <h3 className="font-heading font-extrabold text-lg text-midnightNavy">
                                        {editingPosId ? '✏️ Edit Open Position' : '➕ Add New Open Position'}
                                    </h3>
                                    <button onClick={resetPosModal} className="w-8 h-8 rounded-xl neo-btn-secondary flex items-center justify-center font-bold text-navyMuted text-sm">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Position Name</label>
                                        <input type="text" placeholder="e.g. Sales Manager" value={newPosTitle} onChange={e => setNewPosTitle(e.target.value)} className="w-full p-2.5 rounded-xl neo-input text-midnightNavy font-medium placeholder-navyMuted" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Exp Required</label>
                                            <input type="text" placeholder="e.g. 3-5 Years" value={newPosExp} onChange={e => setNewPosExp(e.target.value)} className="w-full p-2.5 rounded-xl neo-input text-midnightNavy font-medium placeholder-navyMuted" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Max Salary (Lakhs per Annum)</label>
                                            <input type="text" placeholder="e.g. 12 (or 12 LPA)" value={newPosSalary} onChange={e => setNewPosSalary(e.target.value)} className="w-full p-2.5 rounded-xl neo-input text-midnightNavy font-medium placeholder-navyMuted" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Department</label>
                                            <input type="text" placeholder="e.g. Sales" value={newPosDept} onChange={e => setNewPosDept(e.target.value)} className="w-full p-2.5 rounded-xl neo-input text-midnightNavy font-medium placeholder-navyMuted" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Business Unit</label>
                                            <input type="text" placeholder="e.g. AWPs" value={newPosBU} onChange={e => setNewPosBU(e.target.value)} className="w-full p-2.5 rounded-xl neo-input text-midnightNavy font-medium placeholder-navyMuted" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Reporting To</label>
                                        <input type="text" placeholder="e.g. VP Sales" value={newPosReporting} onChange={e => setNewPosReporting(e.target.value)} className="w-full p-2.5 rounded-xl neo-input text-midnightNavy font-medium placeholder-navyMuted" />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-3 pt-3 border-t border-slate-200">
                                    <button onClick={resetPosModal} className="px-4 py-2 neo-btn-secondary text-xs font-bold text-navyMuted">Cancel</button>
                                    <button onClick={handleSavePosition} className="px-5 py-2 neo-btn-primary text-xs font-bold">
                                        {editingPosId ? 'Update Position' : 'Save Position'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CANDIDATE DETAIL MODAL */}
                    {selectedCandidate && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="neo-card p-6 rounded-[22px] max-w-2xl w-full max-h-[90vh] overflow-y-auto space-y-5 border border-slate-200 bg-white">
                                <div className="flex justify-between items-start border-b border-slate-200 pb-3">
                                    <div>
                                        <h3 className="font-heading font-extrabold text-2xl text-midnightNavy">{selectedCandidate.candidateName}</h3>
                                        <p className="text-xs font-bold text-solarOrange">{selectedCandidate.role} • {selectedCandidate.department}</p>
                                    </div>
                                    <button onClick={() => setSelectedCandidate(null)} className="w-8 h-8 rounded-xl neo-btn-secondary flex items-center justify-center font-bold text-navyMuted text-sm">✕</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">CV Source</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.source}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Contact Number</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.contactNumber}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Email Address</p><p className="font-bold text-midnightNavy mt-0.5 truncate">{selectedCandidate.emailId}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current Location</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.location}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current Company</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.currentCompany}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Designation</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.designation}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Overall Experience</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.totalExp}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Notice Period</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.noticePeriod}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.currentCtc}</p></div>
                                    <div className="p-3 rounded-xl neo-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Expected CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.expectedCtc}</p></div>
                                </div>

                                <div className="flex justify-between items-center pt-3 border-t border-slate-200">
                                    <button onClick={() => setSelectedCandidate(null)} className="px-5 py-2 neo-btn-secondary text-xs font-bold text-navyMuted">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
