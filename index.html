<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work Flow - HR Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { neuBg: '#e0e5ec', neuLight: '#ffffff', neuDark: '#a3b1c6' },
                    boxShadow: {
                        neu: '6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff',
                        neuInset: 'inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff',
                        neuSm: '3px 3px 6px #a3b1c6, -3px -3px 6px #ffffff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neuBg text-slate-700 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzg0o4r0RboJGr75shmuf-6fglCaa3xoBTsf6CHUmqe_nNUu5WXAutbCdNJSmgNDlGe/exec";

        function App() {
            const [activeTab, setActiveTab] = React.useState('profiles');
            const [isLoading, setIsLoading] = React.useState(false);
            const [syncStatus, setSyncStatus] = React.useState('Connecting...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);

            // Search filter state
            const [searchTerm, setSearchTerm] = React.useState('');
            
            // Selected candidate state for popup modal
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            const [todos, setTodos] = React.useState([
                { id: '1', text: 'Review shortlisted candidates for L1 interview', completed: false },
                { id: '2', text: 'Follow up on high-CTC profiles', completed: false }
            ]);
            const [newTodo, setNewTodo] = React.useState('');
            const [showAlert, setShowAlert] = React.useState(true);

            // Comprehensive parser for sheet fields
            const parseSheetData = (data) => {
                return data.map((item, index) => ({
                    id: index,
                    candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N/A',
                    source: item['CV -Source-'] || item['CV-Source'] || item['source'] || item['CV SOURCED FROM'] || 'Naukri',
                    location: item['Location'] || item['location'] || 'N/A',
                    role: item['Role'] || item['role'] || 'N/A',
                    department: item['Department'] || item['department'] || 'N/A',
                    businessUnit: item['Business Unit'] || item['businessUnit'] || 'N/A',
                    buHead: item['BU Head'] || item['buHead'] || item['Recruiter'] || 'Unassigned',
                    screenDate: item['CV Screen Date'] || item['screenDate'] || 'N/A',
                    contactNumber: item['Contact Number'] || item['contactNumber'] || 'N/A',
                    currentCompany: item['Current Company'] || item['currentCompany'] || 'N/A',
                    designation: item['Designation'] || item['designation'] || 'N/A',
                    totalExp: item['Overall Experience'] || item['totalExp'] || 'N/A',
                    currentCtc: item['Current CTC'] || item['currentCtc'] || 'N/A',
                    expectedCtc: item['Expected CTC'] || item['expectedCtc'] || 'N/A',
                    noticePeriod: item['Notice Period'] || item['noticePeriod'] || 'N/A',
                    emailId: item['Email'] || item['emailId'] || 'N/A',
                    status: item['Status'] || item['status'] || 'Sourced'
                }));
            };

            const fetchSheetData = React.useCallback(() => {
                setIsLoading(true);
                setSyncStatus('Fetching...');
                fetch(WEBHOOK_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            const formatted = parseSheetData(data);
                            setProfiles(formatted.filter(p => p.status !== 'Joined'));
                            setJoiners(formatted.filter(p => p.status === 'Joined'));
                            setSyncStatus('Synced (' + formatted.length + ' Records)');
                        }
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error('Fetch error:', err);
                        setSyncStatus('Offline');
                        setIsLoading(false);
                    });
            }, []);

            React.useEffect(() => {
                fetchSheetData();
            }, [fetchSheetData]);

            // Confirmation alert before marking joined
            const handleMarkJoined = (candidate) => {
                const confirmed = window.confirm(`Are you sure you want to mark ${candidate.candidateName} as JOINED?`);
                if (confirmed) {
                    const updated = { ...candidate, status: 'Joined' };
                    setProfiles(prev => prev.filter(p => p.candidateName !== candidate.candidateName));
                    setJoiners(prev => [updated, ...prev]);

                    // Send POST request to update Google Sheet
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });

                    // Close modal if open
                    setSelectedCandidate(null);
                    alert(`${candidate.candidateName} has been moved to the Joiners Directory!`);
                }
            };

            // Filter profiles based on search input
            const filteredProfiles = profiles.filter(p => {
                const term = searchTerm.toLowerCase();
                return (
                    p.candidateName.toLowerCase().includes(term) ||
                    p.role.toLowerCase().includes(term) ||
                    p.source.toLowerCase().includes(term) ||
                    p.location.toLowerCase().includes(term) ||
                    p.emailId.toLowerCase().includes(term) ||
                    p.contactNumber.toString().includes(term)
                );
            });

            const getBreakdown = (key) => {
                const allRecords = [...profiles, ...joiners];
                const counts = {};
                allRecords.forEach(item => {
                    const val = item[key] && item[key].toString().trim() !== '' ? item[key] : 'Unspecified';
                    counts[val] = (counts[val] || 0) + 1;
                });
                return Object.entries(counts).sort((a, b) => b[1] - a[1]);
            };

            return (
                <div className="flex h-screen overflow-hidden bg-neuBg">
                    {/* Sidebar */}
                    <div className="w-64 bg-neuBg p-6 shadow-neu flex flex-col justify-between hidden md:flex">
                        <div>
                            <div className="flex items-center space-x-3 mb-8">
                                <div className="w-10 h-10 rounded-xl bg-neuBg shadow-neu flex items-center justify-center font-bold text-blue-600">MW</div>
                                <div>
                                    <h1 className="font-bold text-slate-800">My Work Flow</h1>
                                    <p className="text-xs text-slate-500">HR Operations Portal</p>
                                </div>
                            </div>
                            <nav className="space-y-3">
                                {[
                                    { id: 'dashboard', label: '📊 Deep Analytics' },
                                    { id: 'profiles', label: '📋 Sourced Directory' },
                                    { id: 'joiners', label: '✅ Joiners Directory' },
                                    { id: 'todos', label: '📌 To-Do & Tasks' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`w-full text-left px-4 py-3 rounded-xl transition-all font-medium text-sm ${
                                            activeTab === tab.id ? 'shadow-neuInset text-blue-600 font-semibold' : 'shadow-neu hover:shadow-neuSm text-slate-600'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                        <div className="text-xs text-slate-500 p-3 text-center shadow-neuInset rounded-xl flex items-center justify-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            {syncStatus}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-y-auto p-6 md:p-10">
                        {showAlert && (
                            <div className="mb-6 p-4 rounded-2xl shadow-neu bg-neuBg border-l-4 border-blue-500 flex justify-between items-center">
                                <div>
                                    <h3 className="font-bold text-slate-700">☀️ Good Morning! HR System Active</h3>
                                    <p className="text-sm text-slate-500">Click on any candidate's name in the Sourced Directory to view full profile details.</p>
                                </div>
                                <button onClick={() => setShowAlert(false)} className="px-4 py-2 rounded-xl shadow-neu hover:shadow-neuInset text-xs font-bold text-slate-600">Dismiss</button>
                            </div>
                        )}

                        {/* DASHBOARD TAB */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-700">Recruitment Analytics</h2>
                                        <p className="text-xs text-slate-400 mt-1">Total Dataset: <strong>{profiles.length + joiners.length} Candidates</strong></p>
                                    </div>
                                    <button onClick={fetchSheetData} className="px-5 py-2.5 rounded-xl shadow-neu hover:shadow-neuInset text-xs font-bold text-blue-600 transition">
                                        {isLoading ? 'Processing...' : '↻ Refresh Analytics'}
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="p-6 rounded-2xl shadow-neu bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Total Pipeline</p>
                                        <h3 className="text-3xl font-extrabold text-slate-700 mt-2">{profiles.length + joiners.length}</h3>
                                    </div>
                                    <div className="p-6 rounded-2xl shadow-neu bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Active Sourced</p>
                                        <h3 className="text-3xl font-extrabold text-indigo-600 mt-2">{profiles.length}</h3>
                                    </div>
                                    <div className="p-6 rounded-2xl shadow-neu bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Total Joiners</p>
                                        <h3 className="text-3xl font-extrabold text-emerald-600 mt-2">{joiners.length}</h3>
                                    </div>
                                    <div className="p-6 rounded-2xl shadow-neu bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Conversion Rate</p>
                                        <h3 className="text-3xl font-extrabold text-amber-600 mt-2">
                                            {profiles.length + joiners.length > 0 ? ((joiners.length / (profiles.length + joiners.length)) * 100).toFixed(1) + '%' : '0%'}
                                        </h3>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="p-6 rounded-2xl shadow-neu bg-neuBg space-y-4">
                                        <h3 className="font-bold text-slate-700 border-b border-slate-300 pb-2">📂 Breakdown by CV Source</h3>
                                        <div className="space-y-3 max-h-64 overflow-y-auto pr-2">
                                            {getBreakdown('source').map(([src, count], idx) => (
                                                <div key={idx} className="flex justify-between items-center p-3 rounded-xl shadow-neuInset bg-neuBg">
                                                    <span className="text-sm font-medium text-slate-600 truncate">{src}</span>
                                                    <span className="px-3 py-1 rounded-lg shadow-neu text-xs font-bold text-blue-600">{count} candidates</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="p-6 rounded-2xl shadow-neu bg-neuBg space-y-4">
                                        <h3 className="font-bold text-slate-700 border-b border-slate-300 pb-2">📍 Breakdown by Location</h3>
                                        <div className="space-y-3 max-h-64 overflow-y-auto pr-2">
                                            {getBreakdown('location').map(([loc, count], idx) => (
                                                <div key={idx} className="flex justify-between items-center p-3 rounded-xl shadow-neuInset bg-neuBg">
                                                    <span className="text-sm font-medium text-slate-600 truncate">{loc}</span>
                                                    <span className="px-3 py-1 rounded-lg shadow-neu text-xs font-bold text-emerald-600">{count} candidates</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SOURCED DIRECTORY TAB */}
                        {activeTab === 'profiles' && (
                            <div className="space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-700">Sourced Candidates Directory</h2>
                                        <p className="text-xs text-slate-400 mt-0.5">Showing {filteredProfiles.length} of {profiles.length} total active candidates</p>
                                    </div>
                                    <button onClick={fetchSheetData} className="px-4 py-2 rounded-xl shadow-neu hover:shadow-neuInset text-xs font-bold text-blue-600 self-start md:self-auto">
                                        {isLoading ? 'Syncing...' : '↻ Sync Sheet'}
                                    </button>
                                </div>

                                {/* SEARCH BOX FEATURE */}
                                <div className="p-4 rounded-2xl shadow-neu bg-neuBg flex items-center gap-3">
                                    <span className="text-slate-400 font-bold text-lg">🔍</span>
                                    <input
                                        type="text"
                                        placeholder="Search candidate name, role, source, location, or contact..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full bg-neuBg outline-none text-slate-700 font-medium text-sm placeholder-slate-400"
                                    />
                                    {searchTerm && (
                                        <button onClick={() => setSearchTerm('')} className="text-xs font-bold text-slate-400 px-2 py-1 rounded-lg shadow-neu hover:shadow-neuInset">
                                            Clear
                                        </button>
                                    )}
                                </div>

                                {/* PROFILES TABLE */}
                                <div className="p-6 rounded-2xl shadow-neu bg-neuBg overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-300 text-xs text-slate-400 uppercase">
                                                <th className="p-3">Candidate Name (Click for Info)</th>
                                                <th className="p-3">Source</th>
                                                <th className="p-3">Role</th>
                                                <th className="p-3">Location</th>
                                                <th className="p-3">Exp</th>
                                                <th className="p-3">Notice</th>
                                                <th className="p-3 text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            {filteredProfiles.length === 0 ? (
                                                <tr>
                                                    <td colSpan="7" className="text-center p-6 text-slate-400">
                                                        {isLoading ? 'Loading candidates...' : 'No candidate records match your search query.'}
                                                    </td>
                                                </tr>
                                            ) : (
                                                filteredProfiles.map((p, idx) => (
                                                    <tr key={idx} className="border-b border-slate-200 hover:bg-white/50 transition">
                                                        <td className="p-3">
                                                            <button 
                                                                onClick={() => setSelectedCandidate(p)}
                                                                className="font-semibold text-blue-600 hover:underline text-left flex items-center gap-1.5"
                                                            >
                                                                👤 {p.candidateName}
                                                            </button>
                                                        </td>
                                                        <td className="p-3"><span className="px-2 py-1 rounded-lg shadow-neuSm text-xs">{p.source}</span></td>
                                                        <td className="p-3">{p.role}</td>
                                                        <td className="p-3">{p.location}</td>
                                                        <td className="p-3">{p.totalExp}</td>
                                                        <td className="p-3">{p.noticePeriod}</td>
                                                        <td className="p-3 text-center">
                                                            <button 
                                                                onClick={() => handleMarkJoined(p)} 
                                                                className="px-3 py-1.5 rounded-xl shadow-neu hover:shadow-neuInset text-xs font-bold text-emerald-600 transition"
                                                            >
                                                                Mark Joined
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* JOINERS DIRECTORY */}
                        {activeTab === 'joiners' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-700">Joined Employees ({joiners.length})</h2>
                                <div className="p-6 rounded-2xl shadow-neu bg-neuBg">
                                    {joiners.length === 0 ? <p className="text-slate-400 text-center py-6">No joiners recorded yet.</p> : (
                                        <div className="space-y-3">
                                            {joiners.map((j, idx) => (
                                                <div key={idx} className="p-4 rounded-xl shadow-neu flex justify-between items-center">
                                                    <div>
                                                        <button onClick={() => setSelectedCandidate(j)} className="font-bold text-slate-700 hover:text-blue-600 text-left">
                                                            {j.candidateName}
                                                        </button>
                                                        <p className="text-xs text-slate-500">{j.role} • {j.location} • Exp: {j.totalExp}</p>
                                                    </div>
                                                    <span className="px-3 py-1 rounded-full shadow-neuInset text-xs text-emerald-600 font-bold">Joined</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TODOS TAB */}
                        {activeTab === 'todos' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-700">Daily To-Do & Task Manager</h2>
                                <div className="p-6 rounded-2xl shadow-neu bg-neuBg space-y-4">
                                    <div className="flex gap-2">
                                        <input type="text" placeholder="Add task..." value={newTodo} onChange={e => setNewTodo(e.target.value)} className="flex-1 p-3 rounded-xl shadow-neuInset bg-neuBg outline-none text-sm" />
                                        <button onClick={() => { if(!newTodo) return; setTodos([...todos, { id: Date.now(), text: newTodo, completed: false }]); setNewTodo(''); }} className="px-6 py-3 rounded-xl shadow-neu hover:shadow-neuInset font-bold text-blue-600 text-sm">Add Task</button>
                                    </div>
                                    <div className="space-y-3 mt-4">
                                        {todos.map(todo => (
                                            <div key={todo.id} className={`p-4 rounded-xl shadow-neu flex items-center justify-between ${todo.completed ? 'opacity-60' : ''}`}>
                                                <div className="flex items-center space-x-3">
                                                    <input type="checkbox" checked={todo.completed} onChange={() => setTodos(todos.map(t => t.id === todo.id ? {...t, completed: !t.completed} : t))} className="w-5 h-5 accent-blue-600 cursor-pointer" />
                                                    <span className={`text-sm ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700'}`}>{todo.text}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* CANDIDATE DETAILS POPUP MODAL */}
                    {selectedCandidate && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-neuBg p-6 md:p-8 rounded-3xl shadow-neu max-w-2xl w-full max-h-[90vh] overflow-y-auto space-y-6">
                                <div className="flex justify-between items-start border-b border-slate-300 pb-4">
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-800">{selectedCandidate.candidateName}</h3>
                                        <p className="text-sm font-semibold text-blue-600">{selectedCandidate.role} • {selectedCandidate.department}</p>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedCandidate(null)}
                                        className="w-10 h-10 rounded-xl shadow-neu hover:shadow-neuInset flex items-center justify-center font-bold text-slate-500 text-lg"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">CV Source</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.source}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Contact Number</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.contactNumber}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Email Address</p>
                                        <p className="font-semibold text-slate-700 mt-1 truncate">{selectedCandidate.emailId}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Current Location</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.location}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Current Company</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.currentCompany}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Designation</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.designation}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Overall Experience</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.totalExp}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Notice Period</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.noticePeriod}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Current CTC</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.currentCtc}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Expected CTC</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.expectedCtc}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">BU Head / Recruiter</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.buHead}</p>
                                    </div>
                                    <div className="p-3 rounded-xl shadow-neuInset bg-neuBg">
                                        <p className="text-xs text-slate-400 font-bold uppercase">Business Unit</p>
                                        <p className="font-semibold text-slate-700 mt-1">{selectedCandidate.businessUnit}</p>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center pt-4 border-t border-slate-300">
                                    <button 
                                        onClick={() => setSelectedCandidate(null)}
                                        className="px-5 py-2.5 rounded-xl shadow-neu hover:shadow-neuInset text-xs font-bold text-slate-600"
                                    >
                                        Close
                                    </button>
                                    {selectedCandidate.status !== 'Joined' && (
                                        <button 
                                            onClick={() => handleMarkJoined(selectedCandidate)}
                                            className="px-5 py-2.5 rounded-xl shadow-neu hover:shadow-neuInset text-xs font-bold text-emerald-600"
                                        >
                                            Mark as Joined
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
