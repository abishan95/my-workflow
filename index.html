<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Work Flow - Real-Time Firebase Workspace</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="./logo.jpeg">
    <link rel="apple-touch-icon" href="./logo.jpeg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F8FAFC">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Manrope', 'sans-serif'] },
                    colors: {
                        porcelain: '#F8FAFC', midnightNavy: '#0F172A', navyMuted: '#64748B',
                        solarOrange: '#F97316', solarHover: '#EA580C', successMint: '#10B981', warningAmber: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --parallax-y: 0px;
        }

        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, h4, .font-heading { font-family: 'Manrope', sans-serif; }

        /* SMOOTH LOADER */
        #smooth-preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(145deg, #F8FAFC 0%, #FFF7ED 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s ease;
        }
        #smooth-preloader.loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-ring {
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            border: 3px solid rgba(249, 115, 22, 0.18);
            border-top-color: #F97316;
            animation: spinSmooth 0.85s cubic-bezier(0.4, 0.15, 0.3, 0.85) infinite;
        }
        @keyframes spinSmooth {
            to { transform: rotate(360deg); }
        }

        /* ENTRANCE REVEAL */
        @keyframes entranceReveal {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.985);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .reveal-enter {
            animation: entranceReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .reveal-stagger > * {
            animation: entranceReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .reveal-stagger > *:nth-child(1) { animation-delay: 0.03s; }
        .reveal-stagger > *:nth-child(2) { animation-delay: 0.08s; }
        .reveal-stagger > *:nth-child(3) { animation-delay: 0.13s; }
        .reveal-stagger > *:nth-child(4) { animation-delay: 0.18s; }

        /* HOVER EFFECTS + MICRO INTERACTION (Flat 2D, no 3D tilt) */
        .app-card {
            position: relative;
            background-color: #FFFFFF;
            border-radius: 18px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04);
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.24s ease;
        }
        .app-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(420px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(249, 115, 22, 0.08), transparent 65%);
            transition: opacity 0.25s ease;
        }
        .app-card:hover {
            transform: translateY(-2px);
            border-color: rgba(249, 115, 22, 0.35);
            box-shadow: 0 10px 20px -6px rgba(15, 23, 42, 0.08), 0 4px 8px -4px rgba(249, 115, 22, 0.06);
        }
        .app-card:hover::after {
            opacity: 1;
        }

        /* PARALLAX EFFECT */
        .parallax-layer {
            transform: translate3d(0, var(--parallax-y, 0px), 0);
            transition: transform 0.12s ease-out;
            will-change: transform;
        }

        .app-input {
            background-color: #F8FAFC;
            color: #0F172A;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .app-input:hover {
            border-color: #CBD5E1;
        }
        .app-input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #F97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
            transform: translateY(-1px);
        }

        .app-btn-primary {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
            color: #FFFFFF;
            border-radius: 12px;
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, filter 0.2s ease;
        }
        .app-btn-primary:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 16px -4px rgba(249, 115, 22, 0.38);
            filter: brightness(1.03);
        }
        .app-btn-primary:active {
            transform: scale(0.96) translateY(0);
        }

        .app-btn-secondary {
            background-color: #FFFFFF;
            color: #0F172A;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .app-btn-secondary:hover {
            color: #F97316;
            border-color: rgba(249, 115, 22, 0.4);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px -2px rgba(15, 23, 42, 0.06);
        }
        .app-btn-secondary:active {
            transform: scale(0.96);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="bg-porcelain text-midnightNavy min-h-screen pb-24 md:pb-0">
    <!-- SMOOTH LOADER -->
    <div id="smooth-preloader" aria-hidden="true">
        <div class="loader-ring"></div>
        <p class="font-heading font-bold text-xs tracking-wide text-midnightNavy">Loading My Work Flow...</p>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        // =========================================================================
        // 1. PASTE YOUR FIREBASE CONFIG & GOOGLE SHEET WEBHOOK URL HERE
        // =========================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "my-work-flow-e5eb1.firebaseapp.com",
            projectId: "my-work-flow-e5eb1",
            storageBucket: "my-work-flow-e5eb1.firebasestorage.app",
            messagingSenderId: "888982928867",
            appId: "YOUR_APP_ID"
        };

        const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxkDROFiaB61RSqXk4NpklhR5_XRPcQJdQNAwojglUUVvQzaIyT4Rm_HREMhcTjHg55/exec";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const mirrorToSheet = (payload) => {
            if (!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.includes("YOUR_NEW")) return;
            fetch(SHEET_WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Sheet mirror warning:", err));
        };

        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            AddCandidate: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>,
            Directory: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            Joiners: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Tasks: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>,
            Positions: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Calculator: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
        };

        function MotionCard({ children, className = '' }) {
            const cardRef = React.useRef(null);

            const handleMouseMove = (e) => {
                const el = cardRef.current;
                if (!el) return;
                const rect = el.getBoundingClientRect();
                el.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                el.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            };

            return (
                <div
                    ref={cardRef}
                    onMouseMove={handleMouseMove}
                    className={`app-card ${className}`}
                >
                    {children}
                </div>
            );
        }

        const normalizePhone = (val) => (val || '').toString().replace(/\D/g, '').slice(-10);
        const normalizeEmail = (val) => (val || '').toString().trim().toLowerCase();

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [syncStatus, setSyncStatus] = React.useState('Connecting...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);
            const [positions, setPositions] = React.useState([]);
            const [todos, setTodos] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            const scrollContainerRef = React.useRef(null);

            const getTodayString = () => new Date().toISOString().split('T')[0];
            const getFormattedDDMMYYYY = () => {
                const d = new Date();
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return `${day}-${month}-${d.getFullYear()}`;
            };

            React.useEffect(() => {
                const timer = setTimeout(() => {
                    const loader = document.getElementById('smooth-preloader');
                    if (loader) loader.classList.add('loader-hidden');
                }, 320);
                return () => clearTimeout(timer);
            }, []);

            React.useEffect(() => {
                const container = scrollContainerRef.current;
                if (!container) return;

                const onScroll = () => {
                    const offset = Math.min(container.scrollTop * 0.14, 18);
                    document.documentElement.style.setProperty('--parallax-y', `${-offset.toFixed(1)}px`);
                };

                container.addEventListener('scroll', onScroll, { passive: true });
                return () => container.removeEventListener('scroll', onScroll);
            }, []);

            // ADD CANDIDATE FORM STATE
            const initialCandForm = {
                candidateName: '',
                source: 'Naukri',
                role: '',
                department: '',
                businessUnit: '',
                buHead: '',
                location: '',
                contactNumber: '',
                email: '',
                currentCompany: '',
                designation: '',
                totalExp: '',
                currentCtc: '',
                expectedCtc: '',
                noticePeriod: '',
                screenDate: getFormattedDDMMYYYY(),
                status: 'Sourced'
            };
            const [candForm, setCandForm] = React.useState(initialCandForm);
            const [isSavingCand, setIsSavingCand] = React.useState(false);
            const [candSaveBanner, setCandSaveBanner] = React.useState('');

            // Tasks State
            const [newTaskTitle, setNewTaskTitle] = React.useState('');
            const [newTaskHeading, setNewTaskHeading] = React.useState('Interview schedule');
            const [newTaskDate, setNewTaskDate] = React.useState(getTodayString());
            const [isSavingTask, setIsSavingTask] = React.useState(false);

            // Calculators State
            const [dobInput, setDobInput] = React.useState('');
            const [currentSalInput, setCurrentSalInput] = React.useState('');
            const [hikePercentInput, setHikePercentInput] = React.useState('');
            const [oldSalCompare, setOldSalCompare] = React.useState('');
            const [newSalCompare, setNewSalCompare] = React.useState('');

            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [isInstallable, setIsInstallable] = React.useState(false);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setIsInstallable(false);
                setDeferredPrompt(null);
            };

            const formattedCurrentDate = React.useMemo(() => {
                const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                return new Date().toLocaleDateString('en-US', options);
            }, []);

            const [isAddPosOpen, setIsAddPosOpen] = React.useState(false);
            const [editingPosId, setEditingPosId] = React.useState(null);
            const [newPosTitle, setNewPosTitle] = React.useState('');
            const [newPosExp, setNewPosExp] = React.useState('');
            const [newPosSalary, setNewPosSalary] = React.useState('');
            const [newPosDept, setNewPosDept] = React.useState('');
            const [newPosBU, setNewPosBU] = React.useState('');
            const [newPosReporting, setNewPosReporting] = React.useState('');

            // REAL-TIME FIRESTORE LISTENERS
            React.useEffect(() => {
                const unsubCandidates = db.collection("candidates").onSnapshot((snapshot) => {
                    const allCands = snapshot.docs.map(doc => {
                        const item = doc.data();
                        return {
                            docId: doc.id,
                            rowNumber: item.rowNumber || null,
                            candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N/A',
                            source: item['CV -Source:'] || item['CV -Source-'] || item['source'] || 'Naukri',
                            location: item['Location'] || 'N/A',
                            role: item['Role'] || 'N/A',
                            department: item['Department'] || 'N/A',
                            businessUnit: item['Business Unit'] || item['BU'] || 'N/A',
                            buHead: item['BU Head'] || 'N/A',
                            contactNumber: item['Contact Number'] || 'N/A',
                            currentCompany: item['Current Company'] || 'N/A',
                            designation: item['Designation'] || 'N/A',
                            totalExp: item['Overall Experience'] || item['Total Experience'] || 'N/A',
                            currentCtc: item['Current CTC'] || 'N/A',
                            expectedCtc: item['Expected CTC'] || 'N/A',
                            noticePeriod: item['Notice Period'] || 'N/A',
                            emailId: item['Email'] || 'N/A',
                            screenDate: item['CV Screen Date'] || 'N/A',
                            status: item['Status'] || 'Sourced',
                            createdAt: item.createdAt || 0
                        };
                    });

                    allCands.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                    setProfiles(allCands.filter(p => p.status !== 'Joined' && p.status !== 'Offer Released' && p.status !== 'Revoked'));
                    setJoiners(allCands.filter(p => p.status === 'Joined' || p.status === 'Offer Released' || p.status === 'Revoked'));
                    setSyncStatus(`Live (${allCands.length})`);
                }, (error) => {
                    console.error("Firestore candidates error:", error);
                    setSyncStatus("DB Error");
                });

                const unsubTasks = db.collection("tasks").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                    const loadedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setTodos(loadedTasks);
                });

                const unsubPositions = db.collection("positions").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                    const loadedPositions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPositions(loadedPositions);
                });

                return () => { unsubCandidates(); unsubTasks(); unsubPositions(); };
            }, []);

            // =====================================================================
            // FEATURE 1: DUPLICATE CANDIDATE FINDER (BY PHONE OR EMAIL)
            // =====================================================================
            const duplicateMatches = React.useMemo(() => {
                const phoneClean = normalizePhone(candForm.contactNumber);
                const emailClean = normalizeEmail(candForm.email);

                const hasPhone = phoneClean.length >= 7;
                const hasEmail = emailClean.length >= 4 && emailClean.includes('@');

                if (!hasPhone && !hasEmail) return [];

                const allRecords = [...profiles, ...joiners];
                return allRecords.filter(rec => {
                    const recPhone = normalizePhone(rec.contactNumber);
                    const recEmail = normalizeEmail(rec.emailId);
                    const phoneMatch = hasPhone && recPhone && recPhone === phoneClean;
                    const emailMatch = hasEmail && recEmail && recEmail !== 'n/a' && recEmail === emailClean;
                    return phoneMatch || emailMatch;
                });
            }, [candForm.contactNumber, candForm.email, profiles, joiners]);

            // =====================================================================
            // FEATURE 2 & 3: HISTORY AUTO-SUGGESTIONS + EDITABLE CV SOURCE/VENDORS
            // =====================================================================
            const suggestions = React.useMemo(() => {
                const allRecords = [...profiles, ...joiners];
                const collectUnique = (getter, defaults = []) => {
                    const set = new Set(defaults);
                    allRecords.forEach(rec => {
                        const val = (getter(rec) || '').toString().trim();
                        if (val && val.toUpperCase() !== 'N/A' && val !== '-') {
                            set.add(val);
                        }
                    });
                    return Array.from(set).sort((a, b) => a.localeCompare(b));
                };

                return {
                    sources: collectUnique(r => r.source, ['Naukri', 'LinkedIn', 'Referral', 'Indeed', 'Walk-in', 'Direct']),
                    roles: collectUnique(r => r.role),
                    departments: collectUnique(r => r.department),
                    businessUnits: collectUnique(r => r.businessUnit),
                    buHeads: collectUnique(r => r.buHead),
                    locations: collectUnique(r => r.location),
                    companies: collectUnique(r => r.currentCompany),
                    designations: collectUnique(r => r.designation),
                    experiences: collectUnique(r => r.totalExp),
                    noticePeriods: collectUnique(r => r.noticePeriod, ['Immediate', '15 Days', '30 Days', '60 Days', '90 Days'])
                };
            }, [profiles, joiners]);

            // SAVE NEW CANDIDATE
            const handleAddCandidateSubmit = async (e) => {
                e.preventDefault();
                if (!candForm.candidateName.trim() || isSavingCand) return;

                if (duplicateMatches.length > 0) {
                    const firstDup = duplicateMatches[0];
                    const proceed = window.confirm(
                        `Duplicate alert: A record already exists for "${firstDup.candidateName}" (${firstDup.role} • Status: ${firstDup.status}).\n\nDo you still want to add this candidate?`
                    );
                    if (!proceed) return;
                }

                setIsSavingCand(true);

                try {
                    const docId = "cand_" + Date.now();
                    const cleanSource = (candForm.source || '').trim() || 'Naukri';
                    const firestorePayload = {
                        'Candidate Name': candForm.candidateName.trim(),
                        'CV -Source:': cleanSource,
                        'CV -Source-': cleanSource,
                        'Role': candForm.role.trim() || 'N/A',
                        'Department': candForm.department.trim() || 'N/A',
                        'Business Unit': candForm.businessUnit.trim() || 'N/A',
                        'BU Head': candForm.buHead.trim() || 'N/A',
                        'Location': candForm.location.trim() || 'N/A',

            const ageResult = React.useMemo(() => {
                if (!dobInput || dobInput.trim() === '') return null;
                const cleaned = dobInput.trim().replace(/[\/\.]/g, '-');
                const parts = cleaned.split('-');
                if (parts.length !== 3) return { invalid: true };

                let day, month, year;
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    day = parseInt(parts[2], 10);
                } else {
                    day = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    year = parseInt(parts[2], 10);
                    if (year < 100) year += 2000;
                }

                const birthDate = new Date(year, month, day);
                const today = new Date();
                if (isNaN(birthDate.getTime()) || birthDate > today || month < 0 || month > 11 || day < 1 || day > 31) {
                    return { invalid: true };
                }

                let years = today.getFullYear() - birthDate.getFullYear();
                let months = today.getMonth() - birthDate.getMonth();
                let days = today.getDate() - birthDate.getDate();

                if (days < 0) {
                    months--;
                    const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                    days += prevMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
                const totalMonths = years * 12 + months;
                return { invalid: false, years, months, days, totalDays, totalMonths };
            }, [dobInput]);
