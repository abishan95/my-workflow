<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Work Flow - Premium Personal Workspace</title>
    <!-- PWA Manifest & Mobile Capability Tags -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="./logo.jpeg">
    <link rel="apple-touch-icon" href="./logo.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F8FAFC">
    <!-- Google Fonts: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Manrope', 'sans-serif'],
                    },
                    colors: {
                        porcelain: '#F8FAFC',
                        midnightNavy: '#0F172A',
                        navyMuted: '#64748B',
                        solarOrange: '#F97316',
                        solarHover: '#EA580C',
                        successMint: '#10B981',
                        warningAmber: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Manrope', sans-serif;
        }
        .app-card {
            background-color: #FFFFFF;
            border-radius: 18px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease-in-out;
        }
        .app-input {
            background-color: #F8FAFC;
            color: #0F172A;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            transition: all 0.2s ease;
        }
        .app-input:focus {
            outline: none;
            border-color: #F97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }
        .app-btn-primary {
            background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
            color: #FFFFFF;
            border-radius: 12px;
            transition: all 0.18s ease;
        }
        .app-btn-primary:active {
            transform: scale(0.98);
        }
        .app-btn-secondary {
            background-color: #FFFFFF;
            color: #0F172A;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            transition: all 0.18s ease;
        }
        .app-btn-secondary:hover {
            color: #F97316;
            border-color: #CBD5E1;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-porcelain text-midnightNavy min-h-screen pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        // Register Service Worker for PWA Installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzg0o4r0RboJGr75shmuf-6fglCaa3xoBTsf6CHUmqe_nNUu5WXAutbCdNJSmgNDlGe/exec";

        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Directory: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            Joiners: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Tasks: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>,
            Positions: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Sync: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [isLoading, setIsLoading] = React.useState(true);
            const [syncStatus, setSyncStatus] = React.useState('Syncing...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);
            const [positions, setPositions] = React.useState([]);
            const [todos, setTodos] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            const [taskViewMode, setTaskViewMode] = React.useState('Weekly');
            const [taskFilterStatus, setTaskFilterStatus] = React.useState('All');

            const getTodayString = () => new Date().toISOString().split('T')[0];
            const [newTaskTitle, setNewTaskTitle] = React.useState('');
            const [newTaskHeading, setNewTaskHeading] = React.useState('Interview schedule');
            const [newTaskDate, setNewTaskDate] = React.useState(getTodayString());

            // PWA Install Prompt State
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [isInstallable, setIsInstallable] = React.useState(false);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setIsInstallable(false);
                setDeferredPrompt(null);
            };

            // Dynamic Formatted Date
            const formattedCurrentDate = React.useMemo(() => {
                const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                return new Date().toLocaleDateString('en-US', options);
            }, []);

            // Add/Edit Position Modal State
            const [isAddPosOpen, setIsAddPosOpen] = React.useState(false);
            const [editingPosId, setEditingPosId] = React.useState(null);
            const [newPosTitle, setNewPosTitle] = React.useState('');
            const [newPosExp, setNewPosExp] = React.useState('');
            const [newPosSalary, setNewPosSalary] = React.useState('');
            const [newPosDept, setNewPosDept] = React.useState('');
            const [newPosBU, setNewPosBU] = React.useState('');
            const [newPosReporting, setNewPosReporting] = React.useState('');

            const parseSheetData = (data) => {
                return data.map((item, index) => ({
                    id: index,
                    candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N/A',
                    source: item['CV -Source-'] || item['source'] || 'Naukri',
                    location: item['Location'] || 'N/A',
                    role: item['Role'] || 'N/A',
                    department: item['Department'] || 'N/A',
                    businessUnit: item['Business Unit'] || 'N/A',
                    contactNumber: item['Contact Number'] || 'N/A',
                    currentCompany: item['Current Company'] || 'N/A',
                    designation: item['Designation'] || 'N/A',
                    totalExp: item['Overall Experience'] || 'N/A',
                    currentCtc: item['Current CTC'] || 'N/A',
                    expectedCtc: item['Expected CTC'] || 'N/A',
                    noticePeriod: item['Notice Period'] || 'N/A',
                    emailId: item['Email'] || 'N/A',
                    screenDate: item['CV Screen Date'] || 'N/A',
                    status: item['Status'] || 'Sourced'
                }));
            };

            const fetchSheetData = React.useCallback(() => {
                setIsLoading(true);
                setSyncStatus('Fetching...');
                fetch(WEBHOOK_URL)
                    .then(res => res.json())
                    .then(data => {
                        const rawCandidates = Array.isArray(data) ? data : (data.candidates || []);
                        const rawTasks = !Array.isArray(data) && data.tasks ? data.tasks : [];
                        const rawPositions = !Array.isArray(data) && data.positions ? data.positions : [];

                        const formatted = parseSheetData(rawCandidates);
                        setProfiles(formatted.filter(p => p.status !== 'Joined' && p.status !== 'Offer Released' && p.status !== 'Revoked'));
                        setJoiners(formatted.filter(p => p.status === 'Joined' || p.status === 'Offer Released' || p.status === 'Revoked'));

                        if (rawTasks.length > 0) {
                            setTodos(rawTasks.map(t => ({
                                id: t.id ? t.id.toString() : Date.now().toString(),
                                title: t.title || '',
                                heading: t.heading || 'Custom task',
                                date: t.date || getTodayString(),
                                completed: t.completed === true || t.completed === 'TRUE' || t.completed === 'true'
                            })));
                        }

                        if (rawPositions.length > 0) {
                            setPositions(rawPositions.map(p => ({
                                id: p.id ? p.id.toString() : Date.now().toString(),
                                title: p.title || 'N/A',
                                exp: p.exp || 'N/A',
                                maxSalary: p.maxSalary || 'N/A',
                                department: p.department || 'N/A',
                                businessUnit: p.businessUnit || 'N/A',
                                reportingTo: p.reportingTo || 'N/A',
                                createdDate: p.createdDate || getTodayString(),
                                status: p.status || 'Open'
                            })));
                        }

                        setSyncStatus(`Live (${formatted.length})`);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error('Fetch error:', err);
                        setSyncStatus('Offline');
                        setIsLoading(false);
                    });
            }, []);

            React.useEffect(() => { fetchSheetData(); }, [fetchSheetData]);

            // Auto-format salary with "LPA"
            const formatSalaryLPA = (val) => {
                if (!val) return 'Negotiable';
                const trimmed = val.toString().trim();
                if (/lpa|lacs|lakhs|per annum/i.test(trimmed)) return trimmed;
                return `${trimmed} LPA`;
            };

            const handleSavePosition = () => {
                if (!newPosTitle.trim()) return;
                const formattedSalary = formatSalaryLPA(newPosSalary);

                if (editingPosId) {
                    let updatedPos = null;
                    setPositions(prev => prev.map(p => {
                        if (p.id === editingPosId) {
                            updatedPos = {
                                ...p,
                                type: 'position',
                                title: newPosTitle,
                                exp: newPosExp || '0-2 Yrs',
                                maxSalary: formattedSalary,
                                department: newPosDept || 'General',
                                businessUnit: newPosBU || 'Main Unit',
                                reportingTo: newPosReporting || 'HOD'
                            };
                            return updatedPos;
                        }
                        return p;
                    }));

                    if (updatedPos) {
                        fetch(WEBHOOK_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updatedPos)
                        }).catch(err => console.error("Error updating position:", err));
                    }
                } else {
                    const newPos = {
                        type: 'position',
                        id: Date.now().toString(),
                        title: newPosTitle,
                        exp: newPosExp || '0-2 Yrs',
                        maxSalary: formattedSalary,
                        department: newPosDept || 'General',
                        businessUnit: newPosBU || 'Main Unit',
                        reportingTo: newPosReporting || 'HOD',
                        createdDate: getTodayString(),
                        status: 'Open'
                    };

                    setPositions(prev => [newPos, ...prev]);
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newPos)
                    }).catch(err => console.error("Error adding position:", err));
                }

                resetPosModal();
            };

            const openEditPosition = (pos) => {
                setEditingPosId(pos.id);
                setNewPosTitle(pos.title);
                setNewPosExp(pos.exp);
                setNewPosSalary(pos.maxSalary);
                setNewPosDept(pos.department);
                setNewPosBU(pos.businessUnit);
                setNewPosReporting(pos.reportingTo);
                setIsAddPosOpen(true);
            };

            const resetPosModal = () => {
                setIsAddPosOpen(false);
                setEditingPosId(null);
                setNewPosTitle(''); setNewPosExp(''); setNewPosSalary(''); setNewPosDept(''); setNewPosBU(''); setNewPosReporting('');
            };

            const handlePositionStatusChange = (posId, newStatus) => {
                let updatedPos = null;
                setPositions(prev => prev.map(p => {
                    if (p.id === posId) {
                        updatedPos = { ...p, type: 'position', status: newStatus };
                        return updatedPos;
                    }
                    return p;
                }));

                if (updatedPos) {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedPos)
                    }).catch(err => console.error("Error updating position status:", err));
                }
            };

            const calculateAgeing = (createdDateStr) => {
                if (!createdDateStr || createdDateStr === 'N/A') return 0;
                const created = new Date(createdDateStr);
                const today = new Date();
                const diffTime = Math.abs(today - created);
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            };

            const getProfilesSharedCount = (posTitle, posCreatedDate) => {
                const allCandidates = [...profiles, ...joiners];
                return allCandidates.filter(c => {
                    const matchesRole = c.role.toLowerCase().includes(posTitle.toLowerCase()) || posTitle.toLowerCase().includes(c.role.toLowerCase());
                    if (!matchesRole) return false;
                    if (c.screenDate && c.screenDate !== 'N/A') return c.screenDate >= posCreatedDate;
                    return true;
                }).length;
            };

            const handleStatusChange = (candidate, newStatus) => {
                if (window.confirm(`Change status of ${candidate.candidateName} to "${newStatus}"?`)) {
                    const updated = { ...candidate, status: newStatus };
                    setJoiners(prev => prev.map(item => item.candidateName === candidate.candidateName ? updated : item));
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                }
            };

            const handleMarkJoined = (candidate) => {
                if (window.confirm(`Mark ${candidate.candidateName} as JOINED?`)) {
                    const updated = { ...candidate, status: 'Joined' };
                    setProfiles(prev => prev.filter(p => p.candidateName !== candidate.candidateName));
                    setJoiners(prev => [updated, ...prev]);
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                }
            };

            const handleAddTask = () => {
                if (!newTaskTitle.trim()) return;
                const newTask = {
                    type: 'task',
                    id: Date.now().toString(),
                    title: newTaskTitle,
                    heading: newTaskHeading,
                    date: newTaskDate || getTodayString(),
                    completed: false
                };

                setTodos(prev => [...prev, newTask]);
                setNewTaskTitle('');
                setNewTaskDate(getTodayString());

                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTask)
                }).catch(err => console.error("Error saving task:", err));
            };

            const toggleTaskStatus = (id) => {
                let updatedTask = null;
                setTodos(prev => prev.map(t => {
                    if (t.id === id) {
                        updatedTask = { ...t, type: 'task', completed: !t.completed };
                        return updatedTask;
                    }
                    return t;
                }));

                if (updatedTask) {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedTask)
                    }).catch(err => console.error("Error updating task status:", err));
                }
            };

            const deleteTask = (id) => {
                setTodos(prev => prev.filter(t => t.id !== id));
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'task', action: 'delete_task', id: id })
                }).catch(err => console.error("Error deleting task:", err));
            };

            const filteredProfiles = profiles.filter(p => {
                const term = searchTerm.toLowerCase();
                return (
                    p.candidateName.toLowerCase().includes(term) ||
                    p.role.toLowerCase().includes(term) ||
                    p.source.toLowerCase().includes(term) ||
                    p.location.toLowerCase().includes(term)
                );
            });

            const navItems = [
                { id: 'dashboard', label: 'Home', icon: Icons.Dashboard },
                { id: 'positions', label: 'Positions', icon: Icons.Positions, count: positions.filter(p => p.status === 'Open').length },
                { id: 'profiles', label: 'Sourced', icon: Icons.Directory, count: profiles.length },
                { id: 'joiners', label: 'Joiners', icon: Icons.Joiners, count: joiners.length },
                { id: 'todos', label: 'Tasks', icon: Icons.Tasks, count: todos.length }
            ];

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-porcelain">
                    
                    {/* Desktop Sidebar */}
                    <aside className="w-64 p-5 flex-col justify-between hidden md:flex z-20 m-4 rounded-2xl app-card">
                        <div>
                            <div className="flex items-center space-x-3 mb-8 px-2">
                                <img src="./logo.jpeg" alt="Logo" className="w-10 h-10 rounded-xl object-cover border border-slate-200" />
                                <div>
                                    <h1 className="font-heading font-extrabold text-base leading-tight">My Work Flow</h1>
                                    <p className="text-[11px] text-navyMuted">Talent Acquisition</p>
                                </div>
                            </div>

                            <nav className="space-y-1.5">
                                {navItems.map(tab => {
                                    const IconComp = tab.icon;
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-semibold text-xs transition ${
                                                isActive ? 'bg-orange-50 text-solarOrange border border-orange-200' : 'text-navyMuted hover:text-midnightNavy hover:bg-slate-50'
                                            }`}
                                        >
                                            <div className="flex items-center space-x-3">
                                                <IconComp />
                                                <span className="font-heading">{tab.label}</span>
                                            </div>
                                            {tab.count !== undefined && (
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] ${isActive ? 'bg-solarOrange text-white' : 'bg-slate-100 text-navyMuted'}`}>
                                                    {tab.count}
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>

                        <div className="space-y-2">
                            {isInstallable && (
                                <button onClick={handleInstallApp} className="w-full py-2 px-3 app-btn-primary font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm">
                                    <Icons.Download /> Install App
                                </button>
                            )}
                            <div className="p-3 rounded-xl app-input text-[11px] font-medium text-navyMuted flex items-center justify-between">
                                <span className="flex items-center gap-1.5 truncate">
                                    <span className="w-2 h-2 rounded-full bg-successMint animate-pulse"></span>
                                    <span>{syncStatus}</span>
                                </span>
                                <button onClick={fetchSheetData} className="text-solarOrange font-bold hover:underline">Sync</button>
                            </div>
                        </div>
                    </aside>

                    {/* Main Workspace Layout */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden p-3 md:p-4 md:pl-0">
                        
                        {/* Top Global Bar */}
                        <header className="p-3.5 rounded-2xl app-card mb-3 flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div className="flex items-center justify-between w-full md:w-auto">
                                <div className="flex items-center space-x-2.5">
                                    <img src="./logo.jpeg" alt="Logo" className="w-8 h-8 rounded-xl object-cover border border-slate-200 md:hidden" />
                                    <div>
                                        <h1 className="font-heading font-extrabold text-sm md:text-base leading-tight">
                                            {activeTab === 'dashboard' && 'Personal Overview'}
                                            {activeTab === 'positions' && 'Open Positions Management'}
                                            {activeTab === 'profiles' && 'Sourced Candidates Directory'}
                                            {activeTab === 'joiners' && 'Joiners & Offers'}
                                            {activeTab === 'todos' && 'Task Workflow Console'}
                                        </h1>
                                        <p className="text-[10px] md:text-[11px] text-navyMuted">
                                            {formattedCurrentDate} • Welcome back, Abishan
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-2 md:hidden">
                                    {isInstallable && (
                                        <button onClick={handleInstallApp} className="p-2 app-btn-primary text-xs font-bold rounded-xl">
                                            Install
                                        </button>
                                    )}
                                    <button onClick={fetchSheetData} className="p-2 app-input text-solarOrange rounded-xl">
                                        <Icons.Sync />
                                    </button>
                                </div>
                            </div>

                            {activeTab === 'profiles' && (
                                <div className="w-full md:w-72 relative">
                                    <span className="absolute left-3 top-2.5 text-navyMuted"><Icons.Search /></span>
                                    <input
                                        type="text"
                                        placeholder="Search candidate..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full pl-9 pr-3 py-2 rounded-xl app-input text-xs font-medium"
                                    />
                                </div>
                            )}

                            {activeTab === 'positions' && (
                                <button onClick={() => { resetPosModal(); setIsAddPosOpen(true); }} className="px-3.5 py-2 app-btn-primary text-xs font-bold flex items-center gap-1.5 self-start md:self-auto">
                                    ➕ Add Position
                                </button>
                            )}
                        </header>

                        {/* Scrollable Page Body */}
                        <div className="flex-1 overflow-y-auto pr-0.5 space-y-4 pb-12 md:pb-6">

                            {/* DASHBOARD PAGE */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 md:gap-4">
                                        <div className="p-3.5 rounded-2xl app-card bg-gradient-to-br from-orange-50/80 to-white border-orange-100">
                                            <p className="text-[10px] font-bold text-navyMuted uppercase tracking-wider">Total Pipeline</p>
                                            <h3 className="font-heading text-xl md:text-3xl font-extrabold text-midnightNavy mt-1">{profiles.length + joiners.length}</h3>
                                            <p className="text-[9px] text-solarOrange font-medium mt-0.5">Sourced Records</p>
                                        </div>

                                        <div className="p-3.5 rounded-2xl app-card bg-slate-50/50">
                                            <p className="text-[10px] font-bold text-navyMuted uppercase tracking-wider">Screening</p>
                                            <h3 className="font-heading text-xl md:text-3xl font-extrabold text-midnightNavy mt-1">{profiles.length}</h3>
                                            <p className="text-[9px] text-navyMuted font-medium mt-0.5">In evaluation</p>
                                        </div>

                                        <div className="p-3.5 rounded-2xl app-card bg-emerald-50/60 border-emerald-100">
                                            <p className="text-[10px] font-bold text-navyMuted uppercase tracking-wider">Joiners</p>
                                            <h3 className="font-heading text-xl md:text-3xl font-extrabold text-successMint mt-1">{joiners.length}</h3>
                                            <p className="text-[9px] text-successMint font-medium mt-0.5">Onboarded</p>
                                        </div>

                                        <div className="p-3.5 rounded-2xl app-card bg-amber-50/60 border-amber-100">
                                            <p className="text-[10px] font-bold text-navyMuted uppercase tracking-wider">Pending Tasks</p>
                                            <h3 className="font-heading text-xl md:text-3xl font-extrabold text-warningAmber mt-1">{todos.filter(t => !t.completed).length}</h3>
                                            <p className="text-[9px] text-warningAmber font-medium mt-0.5">Requires focus</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* OPEN POSITIONS PAGE */}
                            {activeTab === 'positions' && (
                                <div className="space-y-4">
                                    <div className="p-4 rounded-2xl app-card space-y-3">
                                        <h2 className="font-heading font-bold text-sm text-midnightNavy">Current Open Positions ({positions.length})</h2>
                                        
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-200 text-[11px] text-navyMuted font-bold uppercase tracking-wider">
                                                        <th className="p-3">Position Name</th>
                                                        <th className="p-3">Dept / BU</th>
                                                        <th className="p-3">Max Salary (LPA)</th>
                                                        <th className="p-3 text-center">Ageing</th>
                                                        <th className="p-3 text-center">Status</th>
                                                        <th className="p-3 text-center">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-xs">
                                                    {positions.length === 0 ? (
                                                        <tr><td colSpan="6" className="text-center p-6 text-navyMuted font-medium">No open positions added yet.</td></tr>
                                                    ) : (
                                                        positions.map((pos, idx) => (
                                                            <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50">
                                                                <td className="p-3 font-bold text-midnightNavy">{pos.title}</td>
                                                                <td className="p-3 text-navyMuted">{pos.department} • <span className="font-semibold text-midnightNavy">{pos.businessUnit}</span></td>
                                                                <td className="p-3 text-solarOrange font-bold">{pos.maxSalary}</td>
                                                                <td className="p-3 text-center font-bold text-warningAmber">{calculateAgeing(pos.createdDate)} d</td>
                                                                <td className="p-3 text-center">
                                                                    <select
                                                                        value={pos.status || 'Open'}
                                                                        onChange={(e) => handlePositionStatusChange(pos.id, e.target.value)}
                                                                        className="px-2 py-1 rounded-lg app-input text-[11px] font-bold outline-none cursor-pointer"
                                                                    >
                                                                        <option value="Open">🟢 Open</option>
                                                                        <option value="Closed">🔵 Closed</option>
                                                                        <option value="Hold">🟡 Hold</option>
                                                                    </select>
                                                                </td>
                                                                <td className="p-3 text-center">
                                                                    <button onClick={() => openEditPosition(pos)} className="px-2.5 py-1 app-btn-secondary text-[11px] font-bold hover:text-solarOrange">✏️ Edit</button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* SOURCED DIRECTORY PAGE */}
                            {activeTab === 'profiles' && (
                                <div className="p-4 rounded-2xl app-card space-y-3">
                                    <h2 className="font-heading font-bold text-sm text-midnightNavy">Sourced Candidates List ({filteredProfiles.length})</h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-[11px] text-navyMuted font-bold uppercase tracking-wider">
                                                    <th className="p-3">Candidate Name</th>
                                                    <th className="p-3">Role</th>
                                                    <th className="p-3">Location</th>
                                                    <th className="p-3 text-center">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-xs">
                                                {filteredProfiles.length === 0 ? (
                                                    <tr><td colSpan="4" className="text-center p-6 text-navyMuted font-medium">No candidate records.</td></tr>
                                                ) : (
                                                    filteredProfiles.map((p, idx) => (
                                                        <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50">
                                                            <td className="p-3">
                                                                <button onClick={() => setSelectedCandidate(p)} className="font-bold text-solarOrange hover:underline text-left">
                                                                    {p.candidateName}
                                                                </button>
                                                            </td>
                                                            <td className="p-3 font-medium text-midnightNavy">{p.role}</td>
                                                            <td className="p-3 text-navyMuted">{p.location}</td>
                                                            <td className="p-3 text-center">
                                                                <button onClick={() => handleMarkJoined(p)} className="px-3 py-1 app-btn-primary text-[11px] font-bold">Mark Joined</button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* JOINERS DIRECTORY PAGE */}
                            {activeTab === 'joiners' && (
                                <div className="p-4 rounded-2xl app-card space-y-3">
                                    <h2 className="font-heading font-bold text-sm text-midnightNavy">Joiners Directory ({joiners.length})</h2>
                                    <div className="space-y-2">
                                        {joiners.map((j, idx) => (
                                            <div key={idx} className="p-3 rounded-xl app-input flex justify-between items-center text-xs">
                                                <div>
                                                    <button onClick={() => setSelectedCandidate(j)} className="font-bold text-midnightNavy hover:text-solarOrange text-left">{j.candidateName}</button>
                                                    <p className="text-[11px] text-navyMuted">{j.role} • {j.location}</p>
                                                </div>
                                                <select value={j.status || 'Joined'} onChange={(e) => handleStatusChange(j, e.target.value)} className="px-2 py-1 rounded-lg app-input text-[11px] font-bold">
                                                    <option value="Joined">🟢 Joined</option>
                                                    <option value="Offer Released">🔵 Offer Released</option>
                                                    <option value="Revoked">🔴 Revoked</option>
                                                </select>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TASK MANAGEMENT PAGE */}
                            {activeTab === 'todos' && (
                                <div className="space-y-4">
                                    <div className="p-4 rounded-2xl app-card space-y-3">
                                        <h2 className="font-heading font-bold text-sm text-midnightNavy">Task Creation Console</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 items-center text-xs">
                                            <input type="text" placeholder="Task description..." value={newTaskTitle} onChange={e => setNewTaskTitle(e.target.value)} className="p-2.5 rounded-xl app-input font-medium" />
                                            <select value={newTaskHeading} onChange={e => setNewTaskHeading(e.target.value)} className="p-2.5 rounded-xl app-input font-bold cursor-pointer">
                                                <option value="Interview schedule">Interview schedule</option>
                                                <option value="Welcome Kit">Welcome Kit</option>
                                                <option value="Reminders">Reminders</option>
                                                <option value="Custom task">Custom task</option>
                                            </select>
                                            <input type="date" value={newTaskDate} onChange={e => setNewTaskDate(e.target.value)} className="p-2.5 rounded-xl app-input font-medium cursor-pointer" />
                                            <button onClick={handleAddTask} className="py-2.5 app-btn-primary font-bold">💾 Save Task</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* Mobile Native Bottom Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 flex items-center justify-around py-2 px-1 md:hidden">
                        {navItems.map(tab => {
                            const IconComp = tab.icon;
                            const isActive = activeTab === tab.id;
                            return (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition ${
                                        isActive ? 'text-solarOrange font-bold' : 'text-navyMuted'
                                    }`}
                                >
                                    <IconComp />
                                    <span className="text-[10px] mt-0.5">{tab.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* ADD / EDIT POSITION MODAL */}
                    {isAddPosOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="app-card p-5 rounded-2xl max-w-lg w-full space-y-4 bg-white">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <h3 className="font-heading font-extrabold text-base text-midnightNavy">
                                        {editingPosId ? '✏️ Edit Position' : '➕ Add Open Position'}
                                    </h3>
                                    <button onClick={resetPosModal} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Position Name</label>
                                        <input type="text" placeholder="e.g. Sales Manager" value={newPosTitle} onChange={e => setNewPosTitle(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Exp Required</label>
                                            <input type="text" placeholder="e.g. 3-5 Years" value={newPosExp} onChange={e => setNewPosExp(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Max Salary (LPA)</label>
                                            <input type="text" placeholder="e.g. 12 (or 12 LPA)" value={newPosSalary} onChange={e => setNewPosSalary(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Department</label>
                                            <input type="text" placeholder="e.g. Sales" value={newPosDept} onChange={e => setNewPosDept(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Business Unit</label>
                                            <input type="text" placeholder="e.g. AWPs" value={newPosBU} onChange={e => setNewPosBU(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Reporting To</label>
                                        <input type="text" placeholder="e.g. VP Sales" value={newPosReporting} onChange={e => setNewPosReporting(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-200">
                                    <button onClick={resetPosModal} className="px-4 py-2 app-btn-secondary text-xs font-bold text-navyMuted">Cancel</button>
                                    <button onClick={handleSavePosition} className="px-4 py-2 app-btn-primary text-xs font-bold">
                                        {editingPosId ? 'Update Position' : 'Save Position'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CANDIDATE DETAIL MODAL */}
                    {selectedCandidate && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="app-card p-5 rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto space-y-4 bg-white">
                                <div className="flex justify-between items-start border-b border-slate-200 pb-3">
                                    <div>
                                        <h3 className="font-heading font-extrabold text-xl text-midnightNavy">{selectedCandidate.candidateName}</h3>
                                        <p className="text-xs font-bold text-solarOrange">{selectedCandidate.role} • {selectedCandidate.department}</p>
                                    </div>
                                    <button onClick={() => setSelectedCandidate(null)} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Source</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.source}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Contact</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.contactNumber}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Location</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.location}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Experience</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.totalExp}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.currentCtc}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Expected CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.expectedCtc}</p></div>
                                </div>

                                <div className="flex justify-end pt-2 border-t border-slate-200">
                                    <button onClick={() => setSelectedCandidate(null)} className="px-4 py-1.5 app-btn-secondary text-xs font-bold text-navyMuted">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
