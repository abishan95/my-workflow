<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Work Flow - Real-Time Firebase Workspace</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="./logo.jpeg">
    <link rel="apple-touch-icon" href="./logo.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F8FAFC">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Compat SDKs for Direct CDN Usage -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Manrope', 'sans-serif'] },
                    colors: {
                        porcelain: '#F8FAFC', midnightNavy: '#0F172A', navyMuted: '#64748B',
                        solarOrange: '#F97316', solarHover: '#EA580C', successMint: '#10B981', warningAmber: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: 'Inter', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3, h4, .font-heading { font-family: 'Manrope', sans-serif; }
        .app-card { background-color: #FFFFFF; border-radius: 18px; border: 1px solid #E2E8F0; box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04); transition: all 0.2s ease-in-out; }
        .app-input { background-color: #F8FAFC; color: #0F172A; border-radius: 12px; border: 1px solid #E2E8F0; transition: all 0.2s ease; }
        .app-input:focus { outline: none; border-color: #F97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }
        .app-btn-primary { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); color: #FFFFFF; border-radius: 12px; transition: all 0.18s ease; }
        .app-btn-primary:active { transform: scale(0.98); }
        .app-btn-secondary { background-color: #FFFFFF; color: #0F172A; border-radius: 12px; border: 1px solid #E2E8F0; transition: all 0.18s ease; }
        .app-btn-secondary:hover { color: #F97316; border-color: #CBD5E1; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body class="bg-porcelain text-midnightNavy min-h-screen pb-24 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        // =========================================================================
        // 1. PASTE YOUR FIREBASE CONFIG & GOOGLE SHEET WEBHOOK URL HERE
        // =========================================================================
   const firebaseConfig = {
    apiKey: "YOUR_ACTUAL_API_KEY_FROM_WEB_APP",
    authDomain: "my-work-flow-e5eb1.firebaseapp.com",
    projectId: "my-work-flow-e5eb1",
    storageBucket: "my-work-flow-e5eb1.firebasestorage.app", // or .appspot.com (match what Firebase shows)
    messagingSenderId: "888982928867",
    appId: "YOUR_ACTUAL_APP_ID_FROM_WEB_APP"
};

        const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyzeyanKZT_0c_83gsbM9CXe9EWDSEZbl4zNiXoalnMKt760qnsWZ6EvIBPpiAEpgUo/exec";

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Helper to mirror UI writes back to Google Sheets in background
        const mirrorToSheet = (payload) => {
            if (!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.includes("YOUR_NEW")) return;
            fetch(SHEET_WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Sheet mirror warning:", err));
        };

        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Directory: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            Joiners: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Tasks: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>,
            Positions: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Calculator: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [syncStatus, setSyncStatus] = React.useState('Connecting...');
            const [profiles, setProfiles] = React.useState([]);
            const [joiners, setJoiners] = React.useState([]);
            const [positions, setPositions] = React.useState([]);
            const [todos, setTodos] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCandidate, setSelectedCandidate] = React.useState(null);

            const getTodayString = () => new Date().toISOString().split('T')[0];
            const [newTaskTitle, setNewTaskTitle] = React.useState('');
            const [newTaskHeading, setNewTaskHeading] = React.useState('Interview schedule');
            const [newTaskDate, setNewTaskDate] = React.useState(getTodayString());
            const [isSavingTask, setIsSavingTask] = React.useState(false);

            // =========================================================================
            // CALCULATOR STATES (AGE & HIKE)
            // =========================================================================
            const [dobInput, setDobInput] = React.useState('');
            
            // Hike Mode 1: Current Salary + Hike % -> New Salary
            const [currentSalInput, setCurrentSalInput] = React.useState('');
            const [hikePercentInput, setHikePercentInput] = React.useState('');

            // Hike Mode 2: Old Salary + New Salary -> Exact Hike % & Amount
            const [oldSalCompare, setOldSalCompare] = React.useState('');
            const [newSalCompare, setNewSalCompare] = React.useState('');

            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [isInstallable, setIsInstallable] = React.useState(false);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setIsInstallable(false);
                setDeferredPrompt(null);
            };

            const formattedCurrentDate = React.useMemo(() => {
                const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                return new Date().toLocaleDateString('en-US', options);
            }, []);

            const [isAddPosOpen, setIsAddPosOpen] = React.useState(false);
            const [editingPosId, setEditingPosId] = React.useState(null);
            const [newPosTitle, setNewPosTitle] = React.useState('');
            const [newPosExp, setNewPosExp] = React.useState('');
            const [newPosSalary, setNewPosSalary] = React.useState('');
            const [newPosDept, setNewPosDept] = React.useState('');
            const [newPosBU, setNewPosBU] = React.useState('');
            const [newPosReporting, setNewPosReporting] = React.useState('');

            // =========================================================================
            // REAL-TIME FIRESTORE LISTENERS
            // =========================================================================
            React.useEffect(() => {
                const unsubCandidates = db.collection("candidates").onSnapshot((snapshot) => {
                    const allCands = snapshot.docs.map(doc => {
                        const item = doc.data();
                        return {
                            docId: doc.id,
                            rowNumber: item.rowNumber || null,
                            candidateName: item['Candidate Name'] || item['candidateName'] || item['NAME'] || 'N/A',
                            source: item['CV -Source-'] || item['source'] || 'Naukri',
                            location: item['Location'] || 'N/A',
                            role: item['Role'] || 'N/A',
                            department: item['Department'] || 'N/A',
                            businessUnit: item['Business Unit'] || 'N/A',
                            contactNumber: item['Contact Number'] || 'N/A',
                            currentCompany: item['Current Company'] || 'N/A',
                            designation: item['Designation'] || 'N/A',
                            totalExp: item['Overall Experience'] || 'N/A',
                            currentCtc: item['Current CTC'] || 'N/A',
                            expectedCtc: item['Expected CTC'] || 'N/A',
                            noticePeriod: item['Notice Period'] || 'N/A',
                            emailId: item['Email'] || 'N/A',
                            screenDate: item['CV Screen Date'] || 'N/A',
                            status: item['Status'] || 'Sourced'
                        };
                    });

                    setProfiles(allCands.filter(p => p.status !== 'Joined' && p.status !== 'Offer Released' && p.status !== 'Revoked'));
                    setJoiners(allCands.filter(p => p.status === 'Joined' || p.status === 'Offer Released' || p.status === 'Revoked'));
                    setSyncStatus(`Live (${allCands.length})`);
                }, (error) => {
                    console.error("Firestore candidates error:", error);
                    setSyncStatus("DB Error");
                });

                const unsubTasks = db.collection("tasks").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                    const loadedTasks = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setTodos(loadedTasks);
                });

                const unsubPositions = db.collection("positions").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                    const loadedPositions = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setPositions(loadedPositions);
                });

                return () => {
                    unsubCandidates();
                    unsubTasks();
                    unsubPositions();
                };
            }, []);

            // =========================================================================
            // AGE CALCULATION LOGIC
            // =========================================================================
            const ageResult = React.useMemo(() => {
                if (!dobInput) return null;
                const birthDate = new Date(dobInput + 'T00:00:00');
                const today = new Date();
                if (isNaN(birthDate.getTime()) || birthDate > today) return { invalid: true };

                let years = today.getFullYear() - birthDate.getFullYear();
                let months = today.getMonth() - birthDate.getMonth();
                let days = today.getDate() - birthDate.getDate();

                if (days < 0) {
                    months--;
                    const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                    days += prevMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
                const totalMonths = years * 12 + months;

                return { invalid: false, years, months, days, totalDays, totalMonths };
            }, [dobInput]);

            // =========================================================================
            // HIKE CALCULATION LOGIC
            // =========================================================================
            const hikeByPercentResult = React.useMemo(() => {
                const curr = parseFloat(currentSalInput);
                const pct = parseFloat(hikePercentInput);
                if (isNaN(curr) || isNaN(pct) || curr < 0) return null;

                const hikeAmount = (curr * pct) / 100;
                const newSalary = curr + hikeAmount;
                return {
                    hikeAmount: hikeAmount.toLocaleString('en-IN', { maximumFractionDigits: 2 }),
                    newSalary: newSalary.toLocaleString('en-IN', { maximumFractionDigits: 2 })
                };
            }, [currentSalInput, hikePercentInput]);

            const hikeBySalaryResult = React.useMemo(() => {
                const oldVal = parseFloat(oldSalCompare);
                const newVal = parseFloat(newSalCompare);
                if (isNaN(oldVal) || isNaN(newVal) || oldVal <= 0) return null;

                const diffAmount = newVal - oldVal;
                const percentChange = (diffAmount / oldVal) * 100;
                return {
                    diffAmount: diffAmount.toLocaleString('en-IN', { maximumFractionDigits: 2 }),
                    percentChange: percentChange.toFixed(2),
                    isPositive: diffAmount >= 0
                };
            }, [oldSalCompare, newSalCompare]);

            const formatSalaryLPA = (val) => {
                if (!val) return 'Negotiable';
                const trimmed = val.toString().trim();
                if (/lpa|lacs|lakhs|per annum/i.test(trimmed)) return trimmed;
                return `${trimmed} LPA`;
            };

            // =========================================================================
            // POSITION ACTIONS
            // =========================================================================
            const handleSavePosition = async () => {
                if (!newPosTitle.trim()) return;
                const formattedSalary = formatSalaryLPA(newPosSalary);

                if (editingPosId) {
                    const existing = positions.find(p => p.id === editingPosId);
                    const updatedData = {
                        title: newPosTitle.trim(),
                        exp: newPosExp || '0-2 Yrs',
                        maxSalary: formattedSalary,
                        department: newPosDept || 'General',
                        businessUnit: newPosBU || 'Main Unit',
                        reportingTo: newPosReporting || 'HOD'
                    };
                    await db.collection("positions").doc(editingPosId).update(updatedData);
                    mirrorToSheet({ type: 'position', id: editingPosId, createdDate: existing?.createdDate || getTodayString(), status: existing?.status || 'Open', ...updatedData });
                } else {
                    const newId = "pos_" + Date.now();
                    const newPos = {
                        id: newId,
                        title: newPosTitle.trim(),
                        exp: newPosExp || '0-2 Yrs',
                        maxSalary: formattedSalary,
                        department: newPosDept || 'General',
                        businessUnit: newPosBU || 'Main Unit',
                        reportingTo: newPosReporting || 'HOD',
                        createdDate: getTodayString(),
                        status: 'Open',
                        createdAt: Date.now()
                    };
                    await db.collection("positions").doc(newId).set(newPos);
                    mirrorToSheet({ type: 'position', ...newPos });
                }
                resetPosModal();
            };

            const openEditPosition = (pos) => {
                setEditingPosId(pos.id);
                setNewPosTitle(pos.title);
                setNewPosExp(pos.exp);
                setNewPosSalary(pos.maxSalary);
                setNewPosDept(pos.department);
                setNewPosBU(pos.businessUnit);
                setNewPosReporting(pos.reportingTo);
                setIsAddPosOpen(true);
            };

            const resetPosModal = () => {
                setIsAddPosOpen(false);
                setEditingPosId(null);
                setNewPosTitle(''); setNewPosExp(''); setNewPosSalary(''); setNewPosDept(''); setNewPosBU(''); setNewPosReporting('');
            };

            const handlePositionStatusChange = async (pos, newStatus) => {
                await db.collection("positions").doc(pos.id).update({ status: newStatus });
                mirrorToSheet({ type: 'position', ...pos, status: newStatus });
            };

            const calculateAgeing = (createdDateStr) => {
                if (!createdDateStr || createdDateStr === 'N/A') return 0;
                const created = new Date(createdDateStr);
                const today = new Date();
                const diffTime = Math.abs(today - created);
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            };

            // =========================================================================
            // CANDIDATE STATUS ACTIONS
            // =========================================================================
            const handleStatusChange = async (candidate, newStatus) => {
                if (window.confirm(`Change status of ${candidate.candidateName} to "${newStatus}"?`)) {
                    await db.collection("candidates").doc(candidate.docId).update({ Status: newStatus });
                    mirrorToSheet({ type: 'candidate_status', rowNumber: candidate.rowNumber, status: newStatus });
                }
            };

            const handleMarkJoined = async (candidate) => {
                if (window.confirm(`Mark ${candidate.candidateName} as JOINED?`)) {
                    await db.collection("candidates").doc(candidate.docId).update({ Status: 'Joined' });
                    mirrorToSheet({ type: 'candidate_status', rowNumber: candidate.rowNumber, status: 'Joined' });
                }
            };

            // =========================================================================
            // TASK ACTIONS
            // =========================================================================
            const handleAddTask = async () => {
                if (!newTaskTitle.trim() || isSavingTask) return;
                setIsSavingTask(true);

                try {
                    const taskId = "task_" + Date.now();
                    const newTask = {
                        id: taskId,
                        title: newTaskTitle.trim(),
                        heading: newTaskHeading,
                        date: newTaskDate || getTodayString(),
                        completed: false,
                        createdAt: Date.now()
                    };

                    await db.collection("tasks").doc(taskId).set(newTask);
                    mirrorToSheet({ type: 'task', ...newTask });

                    setNewTaskTitle('');
                    setNewTaskDate(getTodayString());
                } catch (err) {
                    console.error("Error adding task:", err);
                } finally {
                    setIsSavingTask(false);
                }
            };

            const toggleTaskStatus = async (task) => {
                const newCompleted = !task.completed;
                await db.collection("tasks").doc(task.id).update({ completed: newCompleted });
                mirrorToSheet({ type: 'task', ...task, completed: newCompleted });
            };

            const deleteTask = async (task) => {
                await db.collection("tasks").doc(task.id).delete();
                mirrorToSheet({ type: 'task', action: 'delete_task', id: task.id });
            };

            const filteredProfiles = profiles.filter(p => {
                const term = searchTerm.toLowerCase();
                return (
                    p.candidateName.toLowerCase().includes(term) ||
                    p.role.toLowerCase().includes(term) ||
                    p.source.toLowerCase().includes(term) ||
                    p.location.toLowerCase().includes(term)
                );
            });

            const totalPipelineCount = profiles.length + joiners.length;
            const joinerRate = totalPipelineCount > 0 ? Math.round((joiners.length / totalPipelineCount) * 100) : 0;
            const activePendingTasks = todos.filter(t => !t.completed);

            const navItems = [
                { id: 'dashboard', label: 'Home', icon: Icons.Dashboard },
                { id: 'positions', label: 'Positions', icon: Icons.Positions, count: positions.filter(p => p.status === 'Open').length },
                { id: 'profiles', label: 'Sourced', icon: Icons.Directory, count: profiles.length },
                { id: 'joiners', label: 'Joiners', icon: Icons.Joiners, count: joiners.length },
                { id: 'todos', label: 'Tasks', icon: Icons.Tasks, count: todos.length },
                { id: 'calculators', label: 'Calculators', icon: Icons.Calculator }
            ];

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-porcelain">
                    
                    {/* Desktop Sidebar */}
                    <aside className="w-64 p-5 flex-col justify-between hidden md:flex z-20 m-4 rounded-2xl app-card">
                        <div>
                            <div className="flex items-center space-x-3 mb-8 px-2">
                                <img src="./logo.jpeg" alt="Logo" className="w-10 h-10 rounded-xl object-cover border border-slate-200" />
                                <div>
                                    <h1 className="font-heading font-extrabold text-base leading-tight">My Work Flow</h1>
                                    <p className="text-[11px] text-navyMuted">Firebase Real-Time</p>
                                </div>
                            </div>

                            <nav className="space-y-1.5">
                                {navItems.map(tab => {
                                    const IconComp = tab.icon;
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-semibold text-xs transition ${
                                                isActive ? 'bg-orange-50 text-solarOrange border border-orange-200' : 'text-navyMuted hover:text-midnightNavy hover:bg-slate-50'
                                            }`}
                                        >
                                            <div className="flex items-center space-x-3">
                                                <IconComp />
                                                <span className="font-heading">{tab.label}</span>
                                            </div>
                                            {tab.count !== undefined && (
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] ${isActive ? 'bg-solarOrange text-white' : 'bg-slate-100 text-navyMuted'}`}>
                                                    {tab.count}
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>

                        <div className="space-y-2">
                            {isInstallable && (
                                <button onClick={handleInstallApp} className="w-full py-2 px-3 app-btn-primary font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm">
                                    <Icons.Download /> Install App
                                </button>
                            )}
                            <div className="p-3 rounded-xl app-input text-[11px] font-medium text-navyMuted flex items-center justify-between">
                                <span className="flex items-center gap-1.5 truncate">
                                    <span className="w-2 h-2 rounded-full bg-successMint animate-pulse"></span>
                                    <span>{syncStatus}</span>
                                </span>
                                <span className="text-[10px] text-successMint font-bold">Auto-Sync</span>
                            </div>
                        </div>
                    </aside>

                    {/* Main Workspace Layout */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden p-3 md:p-4 md:pl-0">

                                                    <div className="text-right">
                                                        <p className="text-[10px] font-bold text-navyMuted uppercase">New Expected Salary</p>
                                                        <p className="font-heading font-extrabold text-base text-midnightNavy">{hikeByPercentResult.newSalary}</p>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <hr className="border-slate-100" />

                                        {/* MODE B: Old Salary vs New Salary -> Exact Hike % & Amount */}
                                        <div className="space-y-2.5">
                                            <h3 className="font-heading font-bold text-xs text-midnightNavy flex items-center gap-1.5">
                                                <span className="w-5 h-5 rounded-md bg-orange-100 text-solarOrange flex items-center justify-center text-[10px] font-extrabold">2</span>
                                                Calculate Exact Hike % (Old vs. New Salary)
                                            </h3>
                                            <div className="grid grid-cols-2 gap-2.5 text-xs">
                                                <div>
                                                    <label className="block font-bold text-navyMuted mb-1">Old / Current Salary</label>
                                                    <input
                                                        type="number"
                                                        step="any"
                                                        placeholder="e.g. 5.0"
                                                        value={oldSalCompare}
                                                        onChange={(e) => setOldSalCompare(e.target.value)}
                                                        className="w-full p-2.5 rounded-xl app-input font-semibold"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block font-bold text-navyMuted mb-1">New / Offered Salary</label>
                                                    <input
                                                        type="number"
                                                        step="any"
                                                        placeholder="e.g. 6.8"
                                                        value={newSalCompare}
                                                        onChange={(e) => setNewSalCompare(e.target.value)}
                                                        className="w-full p-2.5 rounded-xl app-input font-semibold"
                                                    />
                                                </div>
                                            </div>

                                            {hikeBySalaryResult && (
                                                <div className={`p-3 rounded-xl border flex items-center justify-between text-xs ${hikeBySalaryResult.isPositive ? 'bg-orange-50/70 border-orange-200' : 'bg-red-50/70 border-red-200'}`}>
                                                    <div>
                                                        <p className="text-[10px] font-bold text-navyMuted uppercase">Exact Hike Value</p>
                                                        <p className={`font-heading font-extrabold text-sm ${hikeBySalaryResult.isPositive ? 'text-midnightNavy' : 'text-red-600'}`}>
                                                            {hikeBySalaryResult.isPositive ? `+${hikeBySalaryResult.diffAmount}` : hikeBySalaryResult.diffAmount}
                                                        </p>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-[10px] font-bold text-navyMuted uppercase">Exact Hike %</p>
                                                        <p className={`font-heading font-extrabold text-base ${hikeBySalaryResult.isPositive ? 'text-solarOrange' : 'text-red-600'}`}>
                                                            {hikeBySalaryResult.isPositive ? `+${hikeBySalaryResult.percentChange}%` : `${hikeBySalaryResult.percentChange}%`}
                                                        </p>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                </div>
                            )}

                        </div>
                    </main>

                    {/* Modern Floating Mobile Bottom Nav Bar */}
                    <nav className="fixed bottom-3 left-3 right-3 z-40 bg-midnightNavy/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-800 flex items-center justify-around py-2 px-1 md:hidden">
                        {navItems.map(tab => {
                            const IconComp = tab.icon;
                            const isActive = activeTab === tab.id;
                            return (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`relative flex flex-col items-center justify-center py-1.5 px-2 rounded-xl transition-all ${
                                        isActive ? 'text-solarOrange font-bold scale-105' : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    <IconComp />
                                    <span className="text-[9px] mt-0.5">{tab.label}</span>
                                    {isActive && <span className="absolute -bottom-1 w-1 h-1 rounded-full bg-solarOrange"></span>}
                                </button>
                            );
                        })}
                    </nav>

                    {/* ADD / EDIT POSITION MODAL */}
                    {isAddPosOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="app-card p-5 rounded-2xl max-w-lg w-full space-y-4 bg-white">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <h3 className="font-heading font-extrabold text-base text-midnightNavy">
                                        {editingPosId ? '✏️ Edit Position' : '➕ Add Open Position'}
                                    </h3>
                                    <button onClick={resetPosModal} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Position Name</label>
                                        <input type="text" placeholder="e.g. Sales Manager" value={newPosTitle} onChange={e => setNewPosTitle(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Exp Required</label>
                                            <input type="text" placeholder="e.g. 3-5 Years" value={newPosExp} onChange={e => setNewPosExp(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Max Salary (LPA)</label>
                                            <input type="text" placeholder="e.g. 12 (or 12 LPA)" value={newPosSalary} onChange={e => setNewPosSalary(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Department</label>
                                            <input type="text" placeholder="e.g. Sales" value={newPosDept} onChange={e => setNewPosDept(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-navyMuted mb-1">Business Unit</label>
                                            <input type="text" placeholder="e.g. AWPs" value={newPosBU} onChange={e => setNewPosBU(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-navyMuted mb-1">Reporting To</label>
                                        <input type="text" placeholder="e.g. VP Sales" value={newPosReporting} onChange={e => setNewPosReporting(e.target.value)} className="w-full p-2.5 rounded-xl app-input" />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-200">
                                    <button onClick={resetPosModal} className="px-4 py-2 app-btn-secondary text-xs font-bold text-navyMuted">Cancel</button>
                                    <button onClick={handleSavePosition} className="px-4 py-2 app-btn-primary text-xs font-bold">
                                        {editingPosId ? 'Update Position' : 'Save Position'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CANDIDATE DETAIL MODAL */}
                    {selectedCandidate && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="app-card p-5 rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto space-y-4 bg-white">
                                <div className="flex justify-between items-start border-b border-slate-200 pb-3">
                                    <div>
                                        <h3 className="font-heading font-extrabold text-xl text-midnightNavy">{selectedCandidate.candidateName}</h3>
                                        <p className="text-xs font-bold text-solarOrange">{selectedCandidate.role} • {selectedCandidate.department}</p>
                                    </div>
                                    <button onClick={() => setSelectedCandidate(null)} className="w-7 h-7 rounded-lg app-btn-secondary flex items-center justify-center font-bold text-xs">✕</button>
                                </div>

                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Source</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.source}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Contact</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.contactNumber}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Location</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.location}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Experience</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.totalExp}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Current CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.currentCtc}</p></div>
                                    <div className="p-2.5 rounded-xl app-input"><p className="text-[10px] text-navyMuted font-bold uppercase">Expected CTC</p><p className="font-bold text-midnightNavy mt-0.5">{selectedCandidate.expectedCtc}</p></div>
                                </div>

                                <div className="flex justify-end pt-2 border-t border-slate-200">
                                    <button onClick={() => setSelectedCandidate(null)} className="px-4 py-1.5 app-btn-secondary text-xs font-bold text-navyMuted">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
